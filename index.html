<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEENATFLIX | 🧕🏻Zeenat69🌹Sonkowa - Ghana Folktales</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}
.topBar{background:linear-gradient(90deg,#ff0055,#ff8a00);padding:12px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.topBar b{font-size:16px}
.topBar a{background:#fff;color:#000;padding:8px 14px;border-radius:20px;font-weight:900;text-decoration:none;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1a1a1a;border:1px solid #222;border-radius:12px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:220px;object-fit:cover;background:#000}
.card .t{padding:8px;font-weight:900;font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{width:100%;background:#1a1a1a;border:1px solid #222;color:#fff;padding:12px;border-radius:12px;margin-bottom:12px;outline:none}
.tiktokBtn{display:block;background:linear-gradient(90deg,#ff0055,#ff8a00);color:#fff;text-align:center;padding:14px;border-radius:25px;text-decoration:none;font-weight:900;margin:14px 0}
</style>
</head>
<body>
<div class="topBar"><b>🎬 ZEENATFLIX</b><div><a href="world.html">🌍 World</a> <a href="admin.html">🔑 Admin</a></div></div>
<input id="search" class="search" placeholder="🔍 Search story..." oninput="doSearch()">
<div id="grid" class="grid"></div>
<a class="tiktokBtn" href="https://www.tiktok.com/@zeenat69.sonkowa" target="_blank">🔥 Follow @zeenat69.sonkowa on TikTok 💚</a>
<script>
// Fallback 22 posters if stories.json fails
const FALLBACK=[
{t:"THE RIVER BRIDE PART 2 - THE LAST NIGHT",img:"THE-RIVER-BRIDE-PART-2-THE-LAST-NIGHT.jpg"},
{t:"THE RIVER BRIDE PART 3 - THE FINAL END",img:"THE-RIVER-BRIDE-PART-3-THE-FINAL-END.jpg"},
{t:"ANANSE AND THE VILLAGE THAT NEVER SLEPT",img:"ANANSE-AND-THE-VILLAGE-THAT-NEVER-SLEPT.jpg"},
{t:"THE STOLEN BABY",img:"THE-STOLEN-BABY.jpg"},
{t:"THE SLAVE TRADE",img:"THE-SLAVE-TRADE.jpg"},
{t:"SHATTERED VOWS",img:"SHATTERED-VOWS.jpg"},
{t:"THE ABANDONED HUTS",img:"THE-ABANDONED-HUTS.jpg"},
{t:"THE FOOD SELLER",img:"THE-FOOD-SELLER.jpg"},
{t:"AMARA",img:"AMARA.jpg"},
{t:"THE LIBRARY SECRET",img:"THE-LIBRARY-SECRET.jpg"},
{t:"THE RIVER BRIDE",img:"THE-RIVER-BRIDE.jpg"},
{t:"THE WHITE MAN",img:"THE-WHITE-MAN.jpg"},
{t:"THE TWINS",img:"THE-TWINS.jpg"},
{t:"THE GENEROUS HUNTER",img:"THE-GENEROUS-HUNTER.jpg"},
{t:"THE HEADMASTER SECRET",img:"THE-HEADMASTER-SECRET.jpg"},
{t:"MY HUSBAND IS A SNAKE",img:"MY-HUSBAND-IS-A-SNAKE.jpg"},
{t:"THE KAYAYO GIRL PART 1",img:"THE-KAYAYO-GIRL-PART-1.jpg"},
{t:"THE GOLDEN CALABASH PART 1",img:"THE-GOLDEN-CALABASH-PART-1.jpg"},
{t:"SAUDI WAHALA - They sold me for $4000",img:"SAUDI-WAHALA.jpg"},
{t:"HE SLEPT WITH MY SISTER ON MY WEDDING DAY",img:"HE-SLEPT-WITH-MY-SISTER.jpg"},
{t:"THE HIDDEN SECRET PART 1",img:"THE-HIDDEN-SECRET-PART-1.jpg"},
{t:"THE MARKET WITCH - Kaneshie Market Witch",img:"THE-MARKET-WITCH.jpg"}
];
let ALL=[];
async function load(){
  try{
    let r=await fetch('stories.json?v='+Date.now());
    if(r.ok){
      let j=await r.json();
      // stories.json is object {title: {t,img,short...}}
      let fromJson=Object.values(j).map(v=>({t:v.t||v.title, img:v.img, short:v.short, long:v.long, full:v.full}));
      // Merge: json first (newest), then fallback without duplicates
      let seen=new Set();
      ALL=[];
      [...fromJson, ...FALLBACK].forEach(m=>{
        let k=(m.t||'').toUpperCase();
        if(k && !seen.has(k)){seen.add(k); ALL.push(m);}
      });
    }else{ALL=FALLBACK;}
  }catch(e){ALL=FALLBACK;}
  render(ALL);
}
function render(list){
  document.getElementById('grid').innerHTML=list.map(m=>`
    <div class="card" onclick='openStory(${JSON.stringify(m.t).replace(/'/g,"&#39;")})'>
      <img src="${m.img}" onerror="this.src='https://via.placeholder.com/300x400?text=${encodeURIComponent(m.t)}'">
      <div class="t">${m.t}</div>
    </div>
  `).join('');
}
function openStory(title){
  let found=ALL.find(x=>x.t===title)||{t:title};
  localStorage.setItem('zeenat_play',JSON.stringify(found));
  location.href='story.html';
}
function doSearch(){
  let q=document.getElementById('search').value.toUpperCase();
  render(ALL.filter(m=>m.t.toUpperCase().includes(q)));
}
load();
</script>
</body>
</html>
