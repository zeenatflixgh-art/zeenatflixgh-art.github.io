<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google-site-verification" content="EuUsFkod2wQSoDWw04__ofEtZ4Pi80VmmhEVXaLpm1I" />
  <title>ZEENATFLIX</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.header{background:linear-gradient(90deg,#ff8a00,#ff0080);padding:16px 15px;text-align:center;border-radius:16px;margin:8px}
.header h1{margin:0;font-size:28px;font-weight:900;color:#fff}
.header p{margin:4px 0 6px;font-size:13px;color:#fff;opacity:0.95}
.links{font-size:12px;color:#fff}
.links a{color:#fff;text-decoration:none;font-weight:700}
.searchWrap{padding:8px 12px;position:sticky;top:0;z-index:99;background:#0a0a0a}
#search{width:100%;padding:13px 18px;border-radius:25px;border:none;background:#fff;color:#000;font-size:15px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#151515;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #222;position:relative}
.card img{width:100%;height:280px;object-fit:cover;display:block}
.lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.65);width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid #ffcc00}
.open{position:absolute;top:8px;right:8px;background:#00ff88;color:#000;padding:3px 8px;border-radius:10px;font-size:9px;font-weight:900}
.info{padding:10px}
.info h3{margin:0;font-size:12px;font-weight:900}
.info.meta{font-size:11px;color:#777;margin-top:4px}
</style>
</head><body>
<div class="header">
<h1>🎬 ZEENATFLIX</h1>
<p>19 Ghana Movies - Tap to Listen!</p>
<div class="links"><a href="world.html">🌍 Go to World People</a> &nbsp;|&nbsp; <a href="admin.html">👑 CEO Admin</a></div>
</div>
<div class="searchWrap"><input id="search" placeholder="🔍 Search Ghana..." onkeyup="render()"></div>
<div class="grid" id="grid"></div>
<script>
const posters=[
{id:"static_0",t:"THE STOLEN BABY",i:"THE-STOLEN-BABY.jpg",v:"3.1M"},
{id:"static_1",t:"MISSING BUT FOUND",i:"MISSING-BUT-FOUND.jpg",v:"2.0M"},
{id:"static_2",t:"SECRETS OF THE LETTER",i:"SECRETS-OF-THE-LETTER.jpg",v:"1.5M"},
{id:"static_3",t:"THE SLAVE TRADE",i:"THE-SLAVE-TRADE.jpg",v:"2.8M"},
{id:"static_4",t:"THE ABANDONED HUTS",i:"THE-ABANDONED-HUTS.jpg",v:"1.2M"},
{id:"static_5",t:"THE TWINS",i:"THE-TWINS.jpg",v:"1.9M"},
{id:"static_6",t:"AMARA",i:"AMARA.jpg",v:"3.2M"},
{id:"static_7",t:"THE FOOD SELLER",i:"THE-FOOD-SELLER.jpg",v:"2.2M"},
{id:"static_8",t:"THE WHITE MAN",i:"THE-WHITE-MAN.jpg",v:"1.1M"},
{id:"static_9",t:"THE RIVER BRIDE",i:"THE-RIVER-BRIDE.jpg",v:"2.5M"},
{id:"static_10",t:"THE GENEROUS HUNTER",i:"THE-GENEROUS-HUNTER.jpg",v:"1.6M"},
{id:"static_11",t:"MY STEPMOTHER'S DAUGHTER",i:"MY-STEPMOTHER.jpg",v:"2.5M"},
{id:"static_12",t:"THE HEADMASTER SECRET",i:"THE-HEADMASTER-SECRET.jpg",v:"1.4M"},
{id:"static_13",t:"FORGOTTEN PROMISE",i:"FORGOTTEN-PROMISE.jpg",v:"1.7M"},
{id:"static_14",t:"THE MARKET GIRL",i:"THE-MARKET-GIRL.jpg",v:"2.0M"},
{id:"static_15",t:"THE LIBRARY SECRET",i:"THE-LIBRARY-SECRET.jpg",v:"2.8M"},
{id:"static_16",t:"DEATH OF NO RETURN",i:"DEATH-OF-NO-RETURN.jpg",v:"1.8M"},
{id:"static_17",t:"FOREST OF NO RETURN",i:"FOREST-OF-NO-RETURN.jpg",v:"1.0M"},
{id:"static_18",t:"SHATTERED VOWS",i:"SHATTERED-VOWS.jpg",v:"2.3M"}
];
function go(id){let s=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");let c=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]").find(m=>m.id==id);if(!s[id]&&!c){alert("🔒 Coming Soon! This story is not ready yet. Please try another one!");return;}location.href='story.html?id='+id;}
function render(){let q=document.getElementById('search').value.toLowerCase();let stories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");let custom=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");let all=[...posters];custom.forEach(cm=>{if(!all.find(p=>p.id==cm.id))all.unshift({id:cm.id,t:cm.title,i:cm.image,v:"NEW"})});let h="";all.forEach(p=>{if(!p.t.toLowerCase().includes(q))return;let has=stories[p.id]||custom.find(m=>m.id==p.id);let img=localStorage.getItem('zeenat_poster_img_'+p.id)||p.i;let badge=!has?`<div class="lock">🔒</div>`:`<div class="open">🔓 OPEN</div>`;h+=`<div class="card" onclick="go('${p.id}')"><img src="${img}" onerror="this.src='https://via.placeholder.com/300x400/ff8a00/fff?text=${encodeURIComponent(p.t)}'">${badge}<div class="info"><h3>${p.t}</h3><div class="meta">👁️ ${p.v} • Ghana</div></div></div>`});document.getElementById('grid').innerHTML=h;}
render();
</script></body></html>
