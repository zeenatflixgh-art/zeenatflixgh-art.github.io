<!DOCTYPE html>

<head>
 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4023320426859249" crossorigin="anonymous"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEENATFLIX - Ghana Movies</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.top{background:linear-gradient(90deg,#ff6a00,#ff0055);margin:8px;padding:16px;border-radius:18px;text-align:center}
.top h1{margin:0;font-size:22px;font-weight:900}.top p{margin:4px 0 0;font-size:13px}
.nav{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nav a{color:#fff;text-decoration:none;background:#000;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700}
.adminHidden{display:none!important}
.search{margin:12px;background:#1a1a1a;border-radius:30px;padding:12px 16px;display:flex;gap:8px;border:1px solid #222}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#151515;border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
.card img{width:100%;height:240px;object-fit:cover;display:block}
.lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;background:rgba(0,0,0,0.85);border:2px solid #ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:2}
.newBadge{position:absolute;top:8px;right:8px;background:#00c853;color:#fff;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:900;z-index:3}
.info{padding:8px}.title{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:#aaa;margin-top:2px;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:11px;color:#888;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.tiktokZone{margin:16px;background:linear-gradient(135deg,#000,#1a1a1a);border:2px solid #ff0055;border-radius:16px;padding:18px;text-align:center}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#ff0055,#ff8a00);color:#fff;padding:14px 22px;border-radius:25px;font-weight:900;font-size:13px;z-index:9999;display:none;max-width:92%}
</style>
</head>
<body>
<div class="top">
<h1>🎬 ZEENATFLIX</h1>
<p>19 Ghana Movies - Tap to Read! 🇬🇭</p>
<div class="nav"><a href="world.html">🌍 World People</a><a href="admin.html" class="adminHidden">👑 CEO Admin</a></div>
</div>
<div class="search">🔍 <input id="s" placeholder="Search Ghana..." oninput="filterMovies()"></div>
<div id="grid" class="grid"><p style="text-align:center;color:#aaa">Loading stories.json...</p></div>
<div class="tiktokZone">
<h2 style="margin:0;color:#ff0055">📱 TikTok Zone - @nextel96</h2>
<p style="color:#fff;font-weight:800;margin:8px 0">🌹 Zeenat 💚 sonkowa</p>
<p style="color:#aaa;font-size:13px">Ghana Movie/Story Tales 🇬🇭<br>AI Videos at TikTok!</p>
<p style="color:#ff8a00;font-size:12px">Full stories: https://zeenatflixgh-art.github.io</p>
<button onclick="doFollowTiktok()" style="background:linear-gradient(90deg,#ff0055,#ff8a00);color:#fff;padding:12px 22px;border-radius:25px;border:none;font-weight:900;margin-top:10px;cursor:pointer">🔥 Follow @nextel96</button>
</div>
<div id="toast" class="toast"></div>
<script>
const MOVIES=[
 {t:"ANANSE AND THE VILLAGE THAT NEVER SLEPT",img:"ANANSE_AND_THE_VILLAGE_THAT_NEVER_SLEPT.jpg",views:"4.1M",likes:"210K",free:true},
{t:"THE STOLEN BABY",img:"THE-STOLEN-BABY.jpg",views:"3.1M",likes:"125K",comments:"8.2K",desc:"A Mother's Worst Nightmare"},
{t:"MISSING BUT FOUND",img:"MISSING-BUT-FOUND.jpg",views:"2.0M",likes:"98K",comments:"5.4K",desc:"Lost 7 Years, Found Selling Pure Water"},

{t:"THE SLAVE TRADE",img:"THE-SLAVE-TRADE.jpg",views:"2.5M",likes:"110K",comments:"6K",desc:"The Pot That Refused To Cross The Sea"},
{t:"SHATTERED VOWS",img:"SHATTERED-VOWS.jpg",views:"2.3M",likes:"105K",comments:"7.1K",desc:"He broke his vow on wedding..."},
{t:"THE ABANDONED HUTS",img:"THE-ABANDONED-HUTS.jpg",views:"1.8M",likes:"87K",comments:"4.3K",desc:"The Vanishing of Maame Serwaa"},
{t:"THE FOOD SELLER",img:"THE-FOOD-SELLER.jpg",views:"2.2M",likes:"95K",comments:"5K",desc:"Monica's Secret"},
{t:"AMARA",img:"AMARA.jpg",views:"3.5M",likes:"150K",comments:"9K",desc:"A girl who wanted Accra"},
{t:"THE LIBRARY SECRET",img:"THE-LIBRARY-SECRET.jpg",views:"1.9M",likes:"80K",comments:"3.2K",desc:"Secret in Kumasi Library"},
{t:"THE RIVER BRIDE",img:"THE-RIVER-BRIDE.jpg",views:"2.1M",likes:"92K",comments:"4K",desc:"Bride of River Tano"},
{t:"THE WHITE MAN",img:"THE-WHITE-MAN.jpg",views:"1.5M",likes:"70K",comments:"2.8K",desc:"Obroni in Ashanti village"},
{t:"THE TWINS",img:"THE-TWINS.jpg",views:"2.8M",likes:"130K",comments:"6.5K",desc:"Twins with one destiny"},
{t:"THE GENEROUS HUNTER",img:"THE-GENEROUS-HUNTER.jpg",views:"1.7M",likes:"75K",comments:"3K",desc:"Hunter who gave everything"},
{t:"THE HEADMASTER SECRET",img:"THE-HEADMASTER-SECRET.jpg",views:"1.6M",likes:"68K",comments:"2.5K",desc:"Headmaster secret 1985"},
{t:"FORGOTTEN PROMISE",img:"FORGOTTEN-PROMISE.jpg",views:"2.0M",likes:"85K",comments:"4.1K",desc:"Promise made in 1990"},
{t:"THE MARKET GIRL",img:"THE-MARKET-GIRL.jpg",views:"2.4M",likes:"100K",comments:"5.2K",desc:"Kejetia market girl rise"},
{t:"MY STEPMOTHERS DAUGHTER",img:"MY-STEPMOTHERS-DAUGHTER.jpg",views:"3.0M",likes:"140K",comments:"8K",desc:"Wicked stepmother story"},
{t:"FOREST OF NO RETURN",img:"FOREST-OF-NO-RETURN.jpg",views:"1.9M",likes:"82K",comments:"3.8K",desc:"Forest where people vanish"},
{t:"DEATH OF NO RETURN",img:"DEATH-OF-NO-RETURN.jpg",views:"2.2M",likes:"90K",comments:"4.5K",desc:"Death that came twice"}
];
let remoteDB={};
function getDB(){
 try{
   let local=JSON.parse(localStorage.getItem('zeenat_stories_db')||'{}');
   return {...remoteDB,...local};
 }catch(e){return remoteDB;}
}
function showToast(msg){
 let t=document.getElementById('toast');
 t.innerText=msg;t.style.display='block';
 setTimeout(()=>{t.style.display='none';},3000);
}
// CEO FIX: INSTANT UNLOCK - if story exists in stories.json = FREE
function hasFullStory(title){
 let db=getDB();
 let key=title.toLowerCase().replace(/\s+/g,'-').replace(/'/g,'');
 let story=db[title]||db[key]||db[Object.keys(db).find(k=>k.toLowerCase()===title.toLowerCase())];
 return!!story;
}
function render(list){
 const g=document.getElementById('grid');g.innerHTML='';
 let db=getDB();
 list.forEach(m=>{
  let key=m.t.toLowerCase().replace(/\s+/g,'-').replace(/'/g,'');
  let posted=db[m.t]||db[key]||db[Object.keys(db).find(k=>k.toLowerCase()===m.t.toLowerCase())]||null;
  // UNLOCK IMMEDIATELY AFTER POSTING
  let isPosted=!!posted;
  let lockHTML=isPosted?`<div class="newBadge">🔓 FREE</div>`:`<div class="lock">🔒</div>`;
  let border=isPosted?'2px solid #00c853':'1px solid #333';
  let shortText=posted?.short||m.desc;
  let d=document.createElement('div');d.className='card';d.style.border=border;
  d.innerHTML=`<img src="${m.img}" onerror="this.src='https://via.placeholder.com/400x600/111/fff?text=${encodeURIComponent(m.t)}'">${lockHTML}<div class="info"><div class="title">${m.t}</div><div class="sub">${shortText}</div><div class="meta"><span>👁️ ${m.views}</span><span>❤️ ${m.likes}</span></div></div>`;
  d.onclick=()=>{
   if(!isPosted){showToast('🚀 No story yet - Will post them soon! Follow @nextel96 💚');return;}
   localStorage.setItem('zeenat_play',JSON.stringify({...m,...posted}));
   location.href='story.html';
  };
  g.appendChild(d);
 });
}
function filterMovies(){let q=document.getElementById('s').value.toLowerCase();render(MOVIES.filter(x=>x.t.toLowerCase().includes(q)));}
async function loadRemote(){
 try{
  let res=await fetch('stories.json?v='+Date.now());
  if(res.ok){
   let data=await res.json();
   remoteDB=data;
   let local=JSON.parse(localStorage.getItem('zeenat_stories_db')||'{}');
   localStorage.setItem('zeenat_stories_db',JSON.stringify({...local,...data}));
   render(MOVIES);
  }else{render(MOVIES);}
 }catch(e){render(MOVIES);}
}
loadRemote();
function doFollowTiktok(){window.open('https://www.tiktok.com/@nextel96','_blank');}
if(localStorage.getItem('zeenat_admin')==='yes'){
 document.querySelectorAll('.adminHidden').forEach(e=>e.style.display='inline-block');
}
</script>
</body>
</html>
