<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEENATFLIX ADMIN - CEO</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;margin:0;padding:8px}
.header{background:linear-gradient(135deg,#ff006a,#ff8a00);padding:12px;border-radius:15px;text-align:center;margin-bottom:12px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:12px}
input,textarea,select{width:100%;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:8px;padding:11px;margin:5px 0;box-sizing:border-box;font-size:14px}
.voice-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.voice-btn{background:#2a2a2a;color:#fff;border:none;padding:13px;border-radius:10px;font-weight:bold;font-size:13px}
.voice-btn.active{background:#ff006a}
.subtitleBox{border:3px solid #ff006a;background:#000;border-radius:12px;padding:14px;text-align:center;font-weight:bold;margin:10px 0;min-height:40px}
.action{width:100%;padding:13px;border:none;border-radius:10px;font-weight:bold;margin:5px 0;font-size:14px}
.green{background:#00c853;color:#fff}
.orange{background:#ff8a00;color:#fff}
.dark{background:#2a2a2a;color:#fff}
.pink{background:#ff006a;color:#fff;font-size:16px}
.previewBox{margin:10px 0;background:#1a1a1a;border:2px dashed #ff006a;border-radius:12px;min-height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.previewBox img{width:100%;max-height:380px;object-fit:contain;border-radius:10px}
</style>
</head>
<body>

<div class="header">
<div style="font-weight:bold">👑 YOUR 19 ORIGINAL STORIES - STATIC</div>
<div style="margin-top:8px;display:flex;gap:6px;justify-content:center">
<button style="background:rgba(0,0,0,0.4);color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold" onclick="location.href='index.html'">🏠 Home</button>
<button style="background:rgba(0,0,0,0.4);color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold">🌍 World</button>
<button style="background:rgba(0,0,0,0.4);color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold" onclick="ceoLogout()">🔒 Logout</button>
</div>
</div>

<div class="card">
<div style="font-weight:bold">📝 YOUR 19 MOVIES - CEO Titles</div>
<select id="movieSelect" onchange="loadMovieData()">
<option value="AMARA (p1)">AMARA (p1)</option>
<option value="AMARA.jpg">1. AMARA.jpg</option>
<option value="THE-LIBRARY-SECRET.jpg">2. THE-LIBRARY-SECRET.jpg</option>
<option value="THE-RIVER-BRIDE.jpg">3. THE-RIVER-BRIDE.jpg</option>
<option value="THE-STOLEN-BABY.jpg">4. THE-STOLEN-BABY.jpg</option>

<option value="MISSING-BUT-FOUND.jpg">8. MISSING-BUT-FOUND.jpg</option>
<option value="SECRETS -OF-THE-LETTER.jpg">9. SECRETS -OF-THE-LETTER.jpg</option>
<option value="THE-GENEROUS-HUNTER.jpg">10. THE-GENEROUS-HUNTER.jpg</option>
<option value="THE-FOOD-SELLER.jpg">11. THE-FOOD-SELLER.jpg</option>
<option value="THE-SLAVE-TRADE.jpg">12. THE-SLAVE-TRADE.jpg</option>
<option value="THE-HEADMASTER-SECRET.jpg">13. THE-HEADMASTER-SECRET.jpg</option>
<option value="FORGOTTEN-PROMISE.jpg">14. FORGOTTEN-PROMISE.jpg</option>
<option value="THE-MARKET-GIRL.jpg">15. THE-MARKET-GIRL.jpg</option>
<option value="MY-STEPMOTHERS-DAUGHTER.jpg">16. MY-STEPMOTHERS-DAUGHTER.jpg</option>
<option value="FOREST-OF-NO-RETURN.jpg">17. FOREST-OF-NO-RETURN.jpg</option>
<option value="SHATTERED-VOW.jpg">18. SHATTERED-VOW.jpg</option>
<option value="DEATH-OF-NO-RETURN.jpg">19. DEATH-OF-NO-RETURN.jpg</option>
<option value="ANANSE.jpg">20. ANANSE - NEW!</option>
</select>

<input type="text" id="titleInput" value="AMARA" placeholder="Title">
<input type="text" id="descInput" placeholder="Short Description">
<textarea id="scriptInput" rows="7">KING: Hello my queen
QUEEN: Yes my king
PRINCESS AMARA: Father!</textarea>

<div style="display:flex;align-items:center;gap:8px;background:#2a2a2a;border-radius:8px;padding:6px">
<input type="file" id="fileInput" accept="image/*" onchange="previewFullImage(event)" style="margin:0;padding:6px;background:#fff;color:#000;width:120px">
<span id="fileLabel">552531.jpg</span>
</div>

<!-- ONLY NEW - FULL IMAGE SHOW -->
<div class="previewBox" id="previewBox"><span style="color:#777;font-size:13px">📸 Full poster will appear here when you choose from gallery</span></div>

<label>🌍 Language</label><select><option>🇬🇭 Ghana English</option></select>

<div style="margin-top:10px;font-weight:bold;font-size:13px">🎤 20 Voices - Tap to Test with Subtitles</div>
<div class="voice-grid">
<button class="voice-btn active">Narrator Male</button><button class="voice-btn">Narrator Female</button>
<button class="voice-btn">King Deep</button><button class="voice-btn">Queen Mother</button>
<button class="voice-btn">Prince</button><button class="voice-btn">Princess Amara</button>
<button class="voice-btn">Old Chief</button><button class="voice-btn">Old Woman</button>
<button class="voice-btn">Boy Child</button><button class="voice-btn">Girl Child</button>
<button class="voice-btn">Guard Deep</button><button class="voice-btn">Maid Soft</button>
<button class="voice-btn">Pastor Male</button><button class="voice-btn">Warrior Male</button>
<button class="voice-btn">Witch Female</button><button class="voice-btn">Husband</button>
<button class="voice-btn">Wife</button><button class="voice-btn">Friend Male</button>
<button class="voice-btn">Friend Female</button><button class="voice-btn">Crying Girl</button>
</div>

<div class="subtitleBox" id="subtitleBox">🎬 Subtitles with yellow word will appear here... Tap a voice!</div>

<button class="action green" onclick="playAll()">▶️ PLAY ALL (Multi-Voice Movie)</button>
<button class="action orange" onclick="pauseResume()">⏸️ PAUSE / RESUME</button>
<button class="action dark" onclick="stopAudio()">⏹️ STOP</button>
<button class="action dark" onclick="testVoices()">🔊 TEST 20 VOICES</button>
<button class="action pink" onclick="postToWorldHome()">📤 POST TO WORLD + HOME</button>
<button class="action dark" onclick="ceoLogout()">Logout</button>
</div>

<script>
// --- HIDDEN PASSWORD - MAINTAINED CEO - YOUR REAL ONE ---
const HIDDEN_CEO_PASSWORD = "Papaja6869$$";
let CEO_LOGGED = localStorage.getItem('ceo_auth') === 'true';
let selectedBase64 = null;

(function checkAuth(){
  if(!CEO_LOGGED){
    let p = prompt("CEO Enter Hidden Password:");
    if(p!== HIDDEN_CEO_PASSWORD){
      document.body.innerHTML = "<h2 style='text-align:center;margin-top:100px;color:#ff006a'>❌ Wrong Password CEO Only!</h2><p style='text-align:center'>Password is Papaja6869$$</p>";
      return;
    }
    localStorage.setItem('ceo_auth','true');
    CEO_LOGGED = true;
  }
})();

function previewFullImage(event){
  const file = event.target.files[0];
  if(!file) return;
  document.getElementById('fileLabel').textContent = file.name;
  const reader = new FileReader();
  reader.onload = e=>{
    selectedBase64 = e.target.result;
    document.getElementById('previewBox').innerHTML = '<img src="'+selectedBase64+'">';
    document.getElementById('subtitleBox').innerHTML = '✅ <span style="color:yellow">'+file.name+'</span> loaded!';
  };
  reader.readAsDataURL(file);
}
function loadMovieData(){
  const v = document.getElementById('movieSelect').value;
  document.getElementById('titleInput').value = v.replace('.jpg','').replace('(p1)','').trim();
  document.getElementById('previewBox').innerHTML = '<img src="'+v+'" onerror="this.parentElement.innerHTML=\'<span style=color:#777>Choose new image</span>\'">';
}
function playAll(){ document.getElementById('subtitleBox').innerHTML = '▶️ Playing <span style="color:yellow">Multi-Voice</span>...'; }
function pauseResume(){ document.getElementById('subtitleBox').innerHTML = '⏸️ Paused'; }
function stopAudio(){ document.getElementById('subtitleBox').innerHTML = '⏹️ Stopped'; }
function testVoices(){ document.getElementById('subtitleBox').innerHTML = '🔊 Testing <span style="color:yellow">20 Voices</span>...'; }
function postToWorldHome(){
  const title = document.getElementById('titleInput').value;
  if(!selectedBase64 &&!document.getElementById('movieSelect').value.includes('.jpg')){ alert('Choose File from gallery!'); return; }
  let img = selectedBase64 || document.getElementById('movieSelect').value;
  let movies = JSON.parse(localStorage.getItem('zeenatflix_movies')||'[]');
  movies.push({title:title,image:img});
  localStorage.setItem('zeenatflix_movies', JSON.stringify(movies));
  alert('✅ '+title+' POSTED! Movie #'+(19+movies.length));
}
function ceoLogout(){ localStorage.removeItem('ceo_auth'); location.reload(); }
document.querySelectorAll('.voice-btn').forEach(b=>{
  b.addEventListener('click', function(){
    document.querySelectorAll('.voice-btn').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    document.getElementById('subtitleBox').innerHTML = '🎤 <span style="color:yellow">'+this.textContent+'</span> ready!';
  });
});
</script>
</body>
                                       </html>
