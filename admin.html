<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEENAT ADMIN V6 - Fixed Immediate Unlock</title><style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding:10px}
.top{background:linear-gradient(90deg,#ff6a00,#ff0055);padding:10px;border-radius:10px;display:flex;gap:8px;margin-bottom:10px}.top a,.top button{flex:1;padding:12px;border:none;border-radius:20px;font-weight:900;text-align:center;text-decoration:none;color:#fff;background:#222}
.box{border:2px solid #ff0055;padding:10px;border-radius:10px;margin-bottom:10px;background:#111}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1;padding:10px;border-radius:20px;border:1px solid #ff0055;background:#222;color:#fff}.tabs button.active{background:#ff0055}
input,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none;color:#000;background:#fff;box-sizing:border-box}
.btnPost{background:linear-gradient(90deg,#ff6a00,#ff0055);color:#fff;border:none;padding:14px;width:100%;border-radius:25px;font-weight:900;font-size:16px;cursor:pointer}
.label{color:#ffeb3b;font-weight:900;margin-top:8px;font-size:12px}
#grid19{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:300px;overflow:auto;background:#0a0a0a;padding:8px;border-radius:8px}#grid19 div{padding:8px;background:#222;border-radius:8px;cursor:pointer;font-size:12px}#grid19 div.sel{border:2px solid #ff0055;background:#331122}
</style></head><body>
<div id="loginScreen"><div style="max-width:400px;margin:50px auto;text-align:center;background:#111;padding:20px;border-radius:15px">
<h2>CEO ADMIN ONLY</h2><input id="adminPass" type="password" placeholder="Enter password"><button class="btnPost" onclick="doLogin()">UNLOCK ADMIN</button><p id="loginMsg" style="color:#ff0055;font-size:12px;margin-top:8px"></p></div></div>
<div id="mainScreen" style="display:none">
<div class="top"><a href="index.html">Home</a><a href="world.html">World</a><button onclick="logoutAdmin()">Logout</button></div>
<div class="box" style="border:2px solid #0f0"><div class="label" style="color:#0f6">GitHub Token - Saved inside</div>
<input id="gh_user" value="zeenatflixgh-art"><input id="gh_repo" value="zeenatflixgh-art.github.io"><input id="gh_token" type="password" placeholder="Paste ghp_ token">
<button class="btnPost" onclick="saveGH()">Save Token</button><p id="gh_status" style="color:#00e676;font-size:12px"></p><p id="currentList" style="color:#00e676;font-size:12px"></p></div>
<div class="tabs"><button id="tabOld" class="active" onclick="setMode('old')">OLD 19</button><button id="tabNew" onclick="setMode('new')">NEW TikTok</button></div>
<div id="oldSection" class="box"><div class="label">Select OLD Poster - Tap!</div><div id="grid19"></div><p>Selected: <b id="selOld" style="color:#ff0055">None</b></p><input id="oldTitleDisplay" readonly placeholder="Tap poster"><div class="label">Short Desc</div><textarea id="oldShort" rows="2"></textarea><div class="label">Long Desc</div><textarea id="oldLong" rows="3"></textarea><div class="label">Chars</div><textarea id="oldChars" rows="2"></textarea><div class="label">OLD Poster REQUIRED</div><input type="file" id="imgOldFile" accept="image/*"><img id="imgOldPrev" style="max-width:100%;display:none"><div class="label">Tags</div><textarea id="oldTags"></textarea><div class="label">Lang</div><input id="oldLang" value="English"><div class="label">Status</div><input id="oldStatus" value="Completed"><button class="btnPost" onclick="postOld()">POST OLD - IMMEDIATE UNLOCK</button></div>
<div id="newSection" class="box" style="display:none"><div class="label">NEW Title</div><input id="newTitle" placeholder="AMARA"><div class="label">Short Desc</div><textarea id="newShort" rows="2"></textarea><div class="label">Long Desc</div><textarea id="newLong" rows="3"></textarea><div class="label">Chars</div><textarea id="newChars" rows="2"></textarea><div class="label">NEW Poster REQUIRED</div><input type="file" id="imgNewFile" accept="image/*"><img id="imgNewPrev" style="max-width:100%;display:none"><div class="label">Full Story</div><textarea id="newFull" rows="6"></textarea><div class="label">Tags</div><textarea id="newTags"></textarea><div class="label">Lang</div><input id="newLang" value="English"><div class="label">Status</div><input id="newStatus" value="Ongoing"><button class="btnPost" onclick="postNew()">POST NEW - IMMEDIATE UNLOCK</button></div>
</div>
<script>
const PWD="Azima6869$$";const MOVIES=["THE STOLEN BABY","MISSING BUT FOUND","SECRETS OF THE LETTER","THE SLIPPER","THE MARKET GIRL","MY STEPMOTHERS DAUGHTER","FORGOTTEN PROMISE","THE ABANDONED HUTS","THE FOOD SELLER","AMARA","THE LIBRARY SECRET","THE RIVER BRIDE","THE WHITE MAN","THE GENEROUS HUNTER","THE HEADMASTER SECRET","FORGOTTEN VOWS","THE RETURN","DEATH OF NO RETURN"];
let selectedOld=null,imgOldB64=null,imgNewB64=null;let GH=JSON.parse(localStorage.getItem('zeenat_gh')||'{"user":"zeenatflixgh-art","repo":"zeenatflixgh-art.github.io","token":""}');
function checkLogin(){if(localStorage.getItem('zeenat_admin_ok')==='yes'){document.getElementById('loginScreen').style.display='none';document.getElementById('mainScreen').style.display='block';}else{document.getElementById('loginScreen').style.display='flex';document.getElementById('mainScreen').style.display='none';}}
function doLogin(){if(document.getElementById('adminPass').value===PWD){localStorage.setItem('zeenat_admin_ok','yes');checkLogin();loadList();}else{document.getElementById('loginMsg').innerText='Wrong password!';}}
function logoutAdmin(){localStorage.removeItem('zeenat_admin_ok');location.reload();}
function saveGH(){let u=document.getElementById('gh_user').value.trim(),r=document.getElementById('gh_repo').value.trim(),t=document.getElementById('gh_token').value.trim();if(!u||!r||!t){alert('Fill all 3!');return;}localStorage.setItem('zeenat_gh',JSON.stringify({user:u,repo:r,token:t}));GH={user:u,repo:r,token:t};document.getElementById('gh_status').innerText='Connected - Token Saved Inside!';loadList();}
function setMode(m){document.getElementById('tabOld').classList.toggle('active',m==='old');document.getElementById('tabNew').classList.toggle('active',m==='new');document.getElementById('oldSection').style.display=m==='old'?'block':'none';document.getElementById('newSection').style.display=m==='new'?'block':'none';}
function buildGrid(){let g=document.getElementById('grid19');g.innerHTML=MOVIES.map(t=>`<div onclick="pickOld('${t.replace(/'/g,"\\'")}')" id="mid_${t.replace(/\s/g,'_')}">${t}</div>`).join('');}
function pickOld(t){selectedOld=t;document.getElementById('oldTitleDisplay').value=t;document.getElementById('selOld').innerText=t;document.querySelectorAll('#grid19 div').forEach(e=>e.classList.remove('sel'));}
function previewOld(){let f=document.getElementById('imgOldFile').files[0];if(!f)return;let r=new FileReader();r.onload=e=>{imgOldB64=e.target.result.split(',')[1];document.getElementById('imgOldPrev').src=e.target.result;document.getElementById('imgOldPrev').style.display='block';};r.readAsDataURL(f);}
function previewNew(){let f=document.getElementById('imgNewFile').files[0];if(!f)return;let r=new FileReader();r.onload=e=>{imgNewB64=e.target.result.split(',')[1];document.getElementById('imgNewPrev').src=e.target.result;document.getElementById('imgNewPrev').style.display='block';};r.readAsDataURL(f);}
async function loadList(){let L=document.getElementById('currentList');if(!GH.token){L.innerText='Save token first!';return;}try{let res=await fetch(`https://api.github.com/repos/${GH.user}/${GH.repo}/contents/stories.json`,{headers:{Authorization:`token ${GH.token}`}});if(res.status==404){L.innerText='No stories yet';return;}let d=await res.json();let c=JSON.parse(atob(d.content));L.innerHTML=Object.keys(c).map(k=>` ${k} `).join('');}catch(e){L.innerText='Error: '+e.message;}}
async function uploadImg(title,b64){let safe=title.toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/--+/g,'-')+'.jpg';let put=await fetch(`https://api.github.com/repos/${GH.user}/${GH.repo}/contents/${safe}`,{method:'PUT',headers:{Authorization:`token ${GH.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Upload ${safe}`,content:b64})});if(put.ok){let d=await put.json();return d.content.download_url||safe;}return safe;}
async function postStory(title,imgB64,imgFallback,chars,shortD,longD,full,tags,lang,statusEl){
if(!GH.token){alert('Save GH token first!');return;}
if(!title){alert('Select/Enter title!');return;}
statusEl.innerText='Uploading '+title+'...';
try{
let imgName=imgB64?await uploadImg(title,imgB64):imgFallback;
let res=await fetch(`https://api.github.com/repos/${GH.user}/${GH.repo}/contents/stories.json`,{headers:{Authorization:`token ${GH.token}`}});
let existing={},sha=null;if(res.ok){let j=await res.json();sha=j.sha;existing=JSON.parse(atob(j.content));}
// === IMMEDIATE UNLOCK FIX - MAINTAIN EVERYTHING ===
let storyData={title:title,image:imgName,chars:chars,short:shortD,long:longD,full:full,tags:tags,lang:lang,status:"FREE",date:new Date().toISOString(),free:true,unlocked:true,postedAt:Date.now(),immediateUnlock:true};
existing[title.toLowerCase().replace(/\s+/g,'-')]=storyData;
let putRes=await fetch(`https://api.github.com/repos/${GH.user}/${GH.repo}/contents/stories.json`,{method:'PUT',headers:{Authorization:`token ${GH.token}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Post ${title} - IMMEDIATE UNLOCK`,content:btoa(unescape(encodeURIComponent(JSON.stringify(existing)))),sha:sha})});
if(putRes.ok){statusEl.innerText=`${title} POSTED & UNLOCKED! Shows immediately!`;loadList();}else{statusEl.innerText='Failed: '+(await putRes.text());}
}catch(e){statusEl.innerText='Error: '+e.message;}
}
function postOld(){let title=selectedOld;let c=document.getElementById('oldChars').value,sh=document.getElementById('oldShort').value,lo=document.getElementById('oldLong').value,fu=lo,ta=document.getElementById('oldTags').value,la=document.getElementById('oldLang').value,st=document.getElementById('oldStatus');let fallback=title.toLowerCase().replace(/\s+/g,'-')+'.jpg';if(!imgOldB64){alert('NEW poster REQUIRED!');return;}postStory(title,imgOldB64,fallback,c,sh,lo,fu,ta,la,st);}
function postNew(){let title=document.getElementById('newTitle').value.trim();if(!imgNewB64){alert('NEW poster!');return;}let c=document.getElementById('newChars').value,sh=document.getElementById('newShort').value,lo=document.getElementById('newLong').value,fu=document.getElementById('newFull').value,ta=document.getElementById('newTags').value,la=document.getElementById('newLang').value,st=document.getElementById('newStatus');postStory(title,imgNewB64,'old.jpg',c,sh,lo,fu,ta,la,st);}
document.getElementById('imgOldFile').addEventListener('change',previewOld);document.getElementById('imgNewFile').addEventListener('change',previewNew);
if(GH.token){document.getElementById('gh_user').value=GH.user;document.getElementById('gh_repo').value=GH.repo;document.getElementById('gh_token').value=GH.token;document.getElementById('gh_status').innerText='Token Loaded Inside!';}
checkLogin();loadList();buildGrid();
</script></body></html>
