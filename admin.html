<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEENATFLIX CEO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif}
.headerTop{background:linear-gradient(90deg,#ff6a00,#ff0055);padding:16px 14px;border-radius:0 0 18px 18px;margin:0 8px}
.headerTitle{font-weight:900;font-size:18px;text-align:center;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.navRow{display:flex;gap:8px;margin-top:12px}
.navBtn{flex:1;background:#000;color:#fff;border:none;padding:10px;border-radius:12px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.card{margin:14px;background:#1e1e1e;border:1px solid #333;border-radius:16px;padding:14px}
.tabBtn{flex:1;padding:14px;border-radius:12px;font-weight:900;border:none;cursor:pointer;font-size:13px}
.activeTab{background:#ff0055;color:#fff}
.inactiveTab{background:#2a2a2a;color:#888;border:1px solid #444}
input,textarea,select{width:100%;background:#2a2a2a;border:1px solid #444;color:#fff;padding:14px;border-radius:12px;margin:8px 0;outline:none;font-size:14px}
label{color:#ddd;font-size:14px;margin:12px 0 4px;display:flex;align-items:center;gap:6px;font-weight:700}
.preview{border:1px dashed #555;border-radius:12px;min-height:80px;display:flex;align-items:center;justify-content:center;color:#666;background:#222;margin:8px 0}
.postBtn{width:100%;background:linear-gradient(90deg,#ff0055,#ff8a00);color:#fff;border:none;padding:16px;border-radius:14px;font-weight:900;font-size:15px;margin-top:12px;cursor:pointer}
.tab{display:none}.tab.show{display:block}
</style>
</head>
<body>

<!-- BRIGHT HEADER - LIKE YOUR SCREENSHOT -->
<div class="headerTop">
<div class="headerTitle">👑 YOUR 19 ORIGINAL STORIES - STATIC</div>
<div class="navRow">
<button class="navBtn" onclick="location.href='index.html'">🏠 Home</button>
<button class="navBtn" onclick="location.href='world.html'">🌍 World</button>
<button class="navBtn" onclick="logout()">🔓 Logout</button>
</div>
</div>

<!-- LOGIN - HIDDEN PASSWORD -->
<div id="loginBox" style="max-width:400px;margin:60px auto;text-align:center;padding:20px">
<h2 style="color:#ff0055">CEO Login</h2>
<input type="password" id="ceoPass" placeholder="Enter CEO Password" style="text-align:center;background:#2a2a2a">
<button onclick="login()" style="width:100%;background:linear-gradient(90deg,#ff0055,#ff8a00);color:#fff;padding:14px;border:none;border-radius:12px;font-weight:800;margin-top:10px">🔓 Unlock</button>
</div>

<div id="adminBox" style="display:none;max-width:780px;margin:0 auto;padding-bottom:80px">

<!-- TABS - OLD / NEW WORKING -->
<div style="display:flex;gap:10px;margin:14px">
<button type="button" id="bOld" class="tabBtn activeTab" onclick="setTab('old')">📁 OLD 19 Posters - Add Story</button>
<button type="button" id="bNew" class="tabBtn inactiveTab" onclick="setTab('new')">📱 NEW Poster - TikTok Gallery</button>
</div>

<div class="card">
<label>📝 Your 19 Posters - Static</label>
<select id="oldSelect"></select>

<label>📝 Title</label>
<input id="title" placeholder="AMARA" value="AMARA">

<label>📄 Short Description (Home page)</label>
<input id="shortDesc" placeholder="Short Description">

<label>🖼️ Choose Image From Phone</label>
<input type="file" id="imgFile" accept="image/*">
<div id="imgPrev" class="preview" style="display:none"><img id="pImg" style="max-width:180px;border-radius:10px"></div>

<label>🎬 Story - CHARACTER: dialogue</label>
<textarea id="story" rows="7" placeholder="KING: hello
QUEEN: hi my king">KING: hello
QUEEN: hi my king</textarea>

<label>🌍 Language</label>
<select id="lang"><option>🇬🇭 Ghana English</option><option>Twi</option><option>English</option><option>French</option><option>Hindi</option></select>

<!-- OLD MODE -->
<div id="tabOld" class="tab show">
<button type="button" onclick="updateOld()" class="postBtn" style="background:#222;border:1px solid #ff0055;color:#ffb6cd">📦 UPDATE OLD POSTER WITH STORY</button>
</div>

<!-- NEW MODE - TIKTOK -->
<div id="tabNew" class="tab">
<label>🏷️ TikTok Hashtags</label>
<input id="hash" placeholder="#ghanafolktale #fyp #kumasi">
<button type="button" onclick="postNew()" class="postBtn">💾 POST TO WORLD + HOME</button>
</div>

<div id="msg" style="text-align:center;color:#0f0;margin-top:12px;font-weight:700"></div>

</div>
</div>

<script>
const PASS='Papaja6869$$';
function login(){if(document.getElementById('ceoPass').value===PASS){localStorage.setItem('zeenat_ceo','1');show();}else alert('Wrong CEO!');}
function show(){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';loadPosters();}
function logout(){localStorage.removeItem('zeenat_ceo');location.reload();}
if(localStorage.getItem('zeenat_ceo')==='1')show();

function setTab(t){
 document.getElementById('tabOld').classList.remove('show');
 document.getElementById('tabNew').classList.remove('show');
 document.getElementById('bOld').className='tabBtn inactiveTab';
 document.getElementById('bNew').className='tabBtn inactiveTab';
 if(t==='old'){document.getElementById('tabOld').classList.add('show');document.getElementById('bOld').className='tabBtn activeTab';}
 else{document.getElementById('tabNew').classList.add('show');document.getElementById('bNew').className='tabBtn activeTab';}
}

// YOUR 19 REAL STATIC POSTERS
const POSTERS=[
"AMARA (static_1)",
"AKOSUA (static_2)",
"ANANSE (static_3)",
"KENTE KING (static_4)",
"MAMI WATA (static_5)",
"VILLAGE SLEEP (static_6)",
"AKWAABA GHOST (static_7)",
"GOLD WARRIOR (static_8)",
"MARKET CURSE (static_9)",
"TWIN DRUMMERS (static_10)",
"ABOSOM FOREST (static_11)",
"CLEVER CHILD (static_12)",
"MOONLIGHT TALES (static_13)",
"TIKTOK JUJU (static_14)",
"JOLLOF WAR (static_15)",
"ACCRA-KUMASI (static_16)",
"CURSED CALABASH (static_17)",
"AUNTIE MANSA (static_18)",
"BLACK STARS (static_19)"
];

function loadPosters(){
 const sel=document.getElementById('oldSelect');
 sel.innerHTML='';
 POSTERS.forEach((n,i)=>{
  const o=document.createElement('option');
  o.value=i;
  o.textContent=n;
  sel.appendChild(o);
 });
 sel.onchange=()=>{
  const name=POSTERS[sel.value];
  document.getElementById('title').value=name.split('(')[0].trim();
 };
}

let imgData='';
document.getElementById('imgFile').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{imgData=r.result;document.getElementById('pImg').src=imgData;document.getElementById('imgPrev').style.display='flex';};
 r.readAsDataURL(f);
});

function getData(){
 return{
  title:document.getElementById('title').value,
  shortDesc:document.getElementById('shortDesc').value,
  story:document.getElementById('story').value,
  img:imgData,
  lang:document.getElementById('lang').value,
  hash:document.getElementById('hash')?.value||'',
  date:Date.now()
 };
}

function updateOld(){
 const idx=document.getElementById('oldSelect').value;
 const d=getData();
 if(!d.title){alert('Add title!');return;}
 let map=JSON.parse(localStorage.getItem('zeenatflix_old_updates')||'{}');
 map[idx]=d;
 localStorage.setItem('zeenatflix_old_updates',JSON.stringify(map));
 document.getElementById('msg').innerText='✅ UPDATED: '+POSTERS[idx]+' -> HOME + WORLD!';
 alert('Updated OLD: '+POSTERS[idx]);
}

function postNew(){
 const d=getData();
 let all=JSON.parse(localStorage.getItem('zeenatflix_movies')||'[]');
 all.unshift({...d,id:Date.now(),type:'new'});
 localStorage.setItem('zeenatflix_movies',JSON.stringify(all));
 document.getElementById('msg').innerText='✅ NEW POSTED: '+d.title+' -> HOME + WORLD!';
 alert('NEW TikTok poster posted!');
}
</script>
</body>
  </html>
