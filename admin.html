<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEENATFLIX CEO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#121212;color:#e0e0e0;font-family:Arial,sans-serif}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;position:sticky;top:0;z-index:10}
.logo{color:#ff0055;font-weight:900}
.btn{border:1px solid #333;background:#222;color:#ccc;padding:8px 14px;border-radius:999px;font-size:13px}
.btn-pink{background:#ff0055;color:#fff;border:none;padding:12px 18px;border-radius:12px;font-weight:800;width:100%;cursor:pointer}
.activeTab{background:#ff0055!important;color:#fff!important;border-color:#ff0055!important}
.inactiveTab{background:#2a2a2a!important;color:#888!important}
.card{margin:12px;background:#1e1e1e;border:1px solid #2e2e2e;border-radius:16px;padding:14px}
input,textarea,select{width:100%;background:#2a2a2a;border:1px solid #3a3a3a;color:#fff;padding:14px;border-radius:12px;margin:7px 0;outline:none}
input::placeholder,textarea::placeholder{color:#777}
label{color:#bbb;font-size:13px;margin-top:12px;display:block}
.preview{border:1px dashed #444;border-radius:14px;min-height:100px;display:flex;align-items:center;justify-content:center;color:#666;background:#222;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabContent{display:none}.tabContent.active{display:block}
</style>
</head>
<body>

<div class="header">
<div class="logo">👑 ZEENATFLIX CEO</div>
<div style="display:flex;gap:6px">
<button class="btn" onclick="location.href='index.html'">🏠 Home</button>
<button class="btn" onclick="location.href='world.html'">🌍 World</button>
<button class="btn" style="border-color:#ff0055;color:#fff" onclick="logout()">🔒 Logout</button>
</div>
</div>

<div id="loginBox" style="max-width:420px;margin:70px auto;padding:20px;text-align:center">
<h2 style="color:#ff0055">CEO Login</h2>
<input type="password" id="ceoPass" placeholder="Enter CEO Password" autocomplete="new-password" style="text-align:center">
<button class="btn-pink" onclick="unlock()">🔓 Unlock</button>
</div>

<div id="adminBox" style="display:none;max-width:750px;margin:0 auto;padding-bottom:80px">

<div class="card">
<div class="grid2">
<button id="btnOld" class="btn-pink activeTab" onclick="switchTab('old')">📁 OLD 19 Posters - Add Story</button>
<button id="btnNew" class="btn-pink inactiveTab" onclick="switchTab('new')">📱 NEW Poster - TikTok Gallery</button>
</div>

<!-- COMMON FIELDS -->
<label>📝 Title</label>
<input id="title" placeholder="Ananse and the Village That Never Slept">
<label>📄 Short Description (Home page)</label>
<input id="shortDesc" placeholder="When spider spins, no one sleeps...">
<label>📖 Long Description (World + SEO)</label>
<textarea id="longDesc" rows="3" placeholder="Ashanti Region, near Kumasi..."></textarea>
<label>🎬 Story - CHARACTER: dialogue</label>
<textarea id="story" rows="8" placeholder="NARRATOR: Long ago...
OLD CHIEF: My people, no one can sleep!
ANANSE: I am Ananse spider man!"></textarea>

<!-- OLD TAB -->
<div id="tabOld" class="tabContent active">
<p style="color:#ffb02e;font-weight:800;font-size:12px;margin-top:18px">📁 UPDATE OLD 19 POSTERS - Choose which old poster you want to add story to</p>
<p style="color:#777;font-size:11px">Select old poster, add story above, then update!</p>
<select id="oldSelect"></select>
<div id="oldPreview" class="preview">📁 Old poster preview</div>
<button class="btn-pink" style="background:#222;border:1px solid #444;color:#ffb6cd" onclick="updateOld()">📦 UPDATE OLD POSTER WITH STORY</button>
</div>

<!-- NEW TAB - TIKTOK GALLERY -->
<div id="tabNew" class="tabContent">
<p style="color:#00f2ea;font-weight:800;font-size:12px;margin-top:18px">📱 NEW POSTER - TikTok Gallery Style</p>
<p style="color:#777;font-size:11px">Upload vertical poster like TikTok - Will show on Home + World as new!</p>

<label>🖼️ Upload Poster Image (9:16 vertical like TikTok)</label>
<input type="file" id="imgFile" accept="image/*">
<div id="newPreview" class="preview" style="display:none"><img id="prevImg" style="max-width:200px;border-radius:12px"></div>

<label>🏷️ TikTok Hashtags</label>
<input id="hashtags" placeholder="#ghanafolktale #ananse #kumasi #fyp">

<label>🎵 Trending Sound / Music Name</label>
<input id="soundName" placeholder="Original Sound - ZeenatFlix">

<button class="btn-pink" onclick="publishNew()" style="margin-top:14px;background:#00f2ea;color:#000">📤 POST NEW TO HOME + WORLD</button>
</div>

<select id="lang" style="margin-top:14px"><option>🇬🇭 Ghana English</option><option>Twi</option><option>English</option><option>French</option></select>

<div id="status" style="margin-top:14px;color:#0f0;text-align:center;font-size:13px"></div>
</div>
</div>

<script>
const PASS='Papaja6869$$';
function unlock(){if(document.getElementById('ceoPass').value===PASS){localStorage.setItem('zeenat_ceo','1');showAdmin();}else alert('Wrong password CEO!');}
function showAdmin(){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';loadOld();}
function logout(){localStorage.removeItem('zeenat_ceo');location.reload();}
if(localStorage.getItem('zeenat_ceo')==='1')showAdmin();

// TABS WORKING NOW!
function switchTab(tab){
 document.getElementById('tabOld').classList.remove('active');
 document.getElementById('tabNew').classList.remove('active');
 document.getElementById('btnOld').classList.remove('activeTab');document.getElementById('btnOld').classList.add('inactiveTab');
 document.getElementById('btnNew').classList.remove('activeTab');document.getElementById('btnNew').classList.add('inactiveTab');
 if(tab==='old'){document.getElementById('tabOld').classList.add('active');document.getElementById('btnOld').classList.add('activeTab');}
 else{document.getElementById('tabNew').classList.add('active');document.getElementById('btnNew').classList.add('activeTab');}
}

let baseMovies=["Ananse & the Pot of Wisdom","The Talking Drum","Kente & the Lost Princess","Mami Wata River","The Village That Never Slept","Akwaaba Ghost","Gold Coast Warrior","Market Day Curse","The Twin Drummers","Abosom Forest","Chief & the Clever Child","Moonlight Tales","TikTok Juju","Ghana Jollof War","Accra to Kumasi","The Cursed Calabash","Auntie Mansa's Shop","Okomfo Anokye Sword","Black Stars Dream"];
function loadOld(){const sel=document.getElementById('oldSelect');sel.innerHTML='<option value="">-- Choose OLD poster --</option>';baseMovies.forEach((t,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+t;sel.appendChild(o);});sel.onchange=()=>{let v=sel.value;document.getElementById('oldPreview').innerHTML=v===''?'📁 Old poster preview':'Selected: <b style=color:#fff>'+baseMovies[v]+'</b>';};}

let imgData='';document.getElementById('imgFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imgData=r.result;document.getElementById('prevImg').src=imgData;document.getElementById('newPreview').style.display='flex';};r.readAsDataURL(f);});
function getForm(){return{title:document.getElementById('title').value||'Ananse',shortDesc:document.getElementById('shortDesc').value||'Ghana folktale',longDesc:document.getElementById('longDesc').value||'Ashanti story',story:document.getElementById('story').value||'NARRATOR: Long ago...',img:imgData||'https://picsum.photos/300/500?random='+Math.floor(Math.random()*100),hashtags:document.getElementById('hashtags')?.value||'#ghanafolktale',sound:document.getElementById('soundName')?.value||'Original Sound',lang:document.getElementById('lang').value,date:new Date().toISOString()}}
function publishNew(){const data=getForm();let all=JSON.parse(localStorage.getItem('zeenatflix_movies')||'[]');all.unshift({...data,id:Date.now(),type:'new'});localStorage.setItem('zeenatflix_movies',JSON.stringify(all));document.getElementById('status').innerHTML='✅ NEW TikTok poster POSTED to Home + World! <b>'+data.title+'</b>';alert('Posted CEO! Check Home & World!');}
function updateOld(){const idx=document.getElementById('oldSelect').value;if(idx===''){alert('Choose OLD poster first!');return;}const data=getForm();let upd=JSON.parse(localStorage.getItem('zeenatflix_old_updates')||'{}');upd[idx]=data;localStorage.setItem('zeenatflix_old_updates',JSON.stringify(upd));document.getElementById('status').innerHTML='✅ OLD Poster updated!';alert('OLD poster updated!');}
</script>
</body>
</html>
