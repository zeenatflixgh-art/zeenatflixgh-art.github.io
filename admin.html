<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEENATFLIX CEO</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;margin:0;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.badge{background:#1e1e1e;padding:6px 12px;border-radius:20px;font-size:13px;border:1px solid #333}
.pink{background:#ff0055;color:#fff;border:none;padding:12px 18px;border-radius:12px;font-weight:bold;cursor:pointer;width:100%;margin:6px 0}
.dark{background:#1e1e1e;color:#aaa;border:1px solid #333;padding:10px;border-radius:10px}
input,textarea,select{width:100%;background:#1e1e1e;border:1px solid #333;color:#fff;padding:14px;border-radius:12px;margin:8px 0;box-sizing:border-box}
label{color:#888;font-size:13px;margin-top:12px;display:block}
.preview{border:1px dashed #444;border-radius:12px;padding:40px;text-align:center;color:#555;margin:10px 0}
</style>
</head>
<body>

<!-- TOP -->
<div class="top">
<div style="color:#ff0055;font-weight:bold">👑 ZEENATFLIX CEO</div>
<div style="display:flex;gap:6px">
<button class="badge" onclick="location.href='index.html'">🏠 Home</button>
<button class="badge" onclick="location.href='world.html'">🌍 World</button>
<button class="badge" style="border-color:#ff0055;color:#fff" onclick="logout()">🔓 Logout</button>
</div>
</div>

<!-- CEO LOGIN - PASSWORD HIDDEN -->
<div id="loginBox" style="text-align:center;margin-top:70px">
<h2 style="color:#ff0055">CEO Login</h2>
<!-- HIDDEN PASSWORD: type=password shows ••••• -->
<input type="password" id="ceoPass" placeholder="Enter CEO Password" autocomplete="new-password" style="text-align:center">
<button class="pink" onclick="checkPass()">🔓 Unlock</button>
</div>

<!-- ADMIN BOX -->
<div id="adminBox" style="display:none">

<div style="display:flex;gap:10px;margin:16px 0">
<button class="pink">📁 OLD 19 Posters - Add Story</button>
<button class="dark" style="flex:1">📱 NEW Poster - TikTok Gallery</button>
</div>

<label>📝 Title</label>
<input id="title" placeholder="Ananse and the Village That Never Slept">

<label>📄 Short Description (Home page)</label>
<input id="shortDesc" placeholder="When spider spins, no one sleeps. Ghana folktale...">

<label>📖 Long Description (World + SEO)</label>
<textarea id="longDesc" rows="3" placeholder="Ashanti Region, near Kumasi, village Akokrom cursed no sleep..."></textarea>

<label>🎬 Story - CHARACTER: dialogue</label>
<textarea id="story" rows="10" placeholder="NARRATOR: Long ago...
OLD CHIEF: My people, no one can sleep!
ANANSE: I am Ananse spider man!"></textarea>

<div style="margin-top:22px">
<label style="color:orange;font-weight:bold">📁 UPDATE OLD 19 POSTERS - Choose which old poster you want to add story to</label>
<p style="color:#666;font-size:12px">Your old 19 posters in index.html have no stories. Select one here, add Title/Desc/Story above, then POST. Story will attach to that poster! No need gallery!</p>

<select id="oldPoster">
<option>-- Choose OLD poster to add story --</option>
<option>Poster 1</option><option>Poster 2</option><option>Poster 3</option>
<option>Poster 4</option><option>Poster 5</option><option>Poster 6</option>
<option>Poster 7</option><option>Poster 8</option><option>Poster 9</option>
<option>Poster 10</option><option>Poster 11</option><option>Poster 12</option>
<option>Poster 13</option><option>Poster 14</option><option>Poster 15</option>
<option>Poster 16</option><option>Poster 17</option><option>Poster 18</option>
<option>Poster 19</option>
</select>

<div class="preview">📁 Old poster preview</div>

<button class="pink">📦 UPDATE OLD POSTER WITH STORY</button>
</div>

<div style="margin-top:22px">
<label>🌍 9 Languages</label>
<select>
<option>🇬🇭 Ghana English</option>
<option>🇬🇭 Twi</option>
<option>🇬🇭 Ga</option>
<option>🇬🇧 English</option>
<option>🇫🇷 French</option>
<option>🇳🇬 Pidgin</option>
<option>🇮🇳 Hindi</option>
<option>🇪🇸 Spanish</option>
<option>🇵🇹 Portuguese</option>
</select>
</div>

<!-- VOICES SECTION REMOVED COMPLETELY - NO UNLOCK AUDIO, NO PLAY ALL, NO STOP -->

<div style="margin-top:30px">
<button class="pink" style="padding:16px;font-size:16px">💾 SAVE & PUBLISH STORY</button>
</div>

</div>

<script>
function checkPass(){
  var p=document.getElementById('ceoPass').value;
  if(p==='Papaja6869$$'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminBox').style.display='block';
    localStorage.setItem('zeenatflix_ceo','true');
  }else{alert('Wrong password CEO!');}
}
function logout(){
  localStorage.removeItem('zeenatflix_ceo');
  location.reload();
}
if(localStorage.getItem('zeenatflix_ceo')==='true'){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminBox').style.display='block';
}
</script>
</body>
  </html>
