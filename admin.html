<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ZEENATFLIX CEO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial}
.headerTop{background:linear-gradient(90deg,#ff6a00,#ff0055);padding:16px 14px;border-radius:0 0 18px 18px;margin:0 8px 10px}
.headerTitle{font-weight:900;font-size:16px;text-align:center}
.navRow{display:flex;gap:8px;margin-top:12px}
.navBtn{flex:1;background:#000;color:#fff;border:none;padding:10px;border-radius:12px;font-weight:700;cursor:pointer}
.card{margin:12px;background:#1e1e1e;border:1px solid #333;border-radius:16px;padding:14px}
.tabBtn{flex:1;padding:14px;border-radius:12px;font-weight:900;border:none;cursor:pointer;font-size:12px}
.activeTab{background:#ff0055;color:#fff}.inactiveTab{background:#2a2a2a;color:#888;border:1px solid #444}
input,textarea,select{width:100%;background:#2a2a2a;border:1px solid #444;color:#fff;padding:14px;border-radius:12px;margin:8px 0;outline:none}
label{color:#ddd;font-size:13px;margin:10px 0 4px;display:flex;gap:6px;font-weight:700}
.postBtn{width:100%;background:linear-gradient(90deg,#ff0055,#ff8a00);color:#fff;border:none;padding:16px;border-radius:14px;font-weight:900;margin-top:12px;cursor:pointer}
.previewFull{width:100%;border:1px solid #ff0055;border-radius:14px;min-height:100px;display:none;justify-content:center;background:#111;margin:10px 0;padding:8px}
.previewFull img{width:100%;max-height:380px;object-fit:contain;border-radius:10px}
.tabContent{display:none}.tabContent.show{display:block}
</style>
</head>
<body>
<div class="headerTop">
<div class="headerTitle">👑 YOUR 19 ORIGINAL STORIES - STATIC</div>
<div class="navRow">
<button class="navBtn" onclick="location.href='index.html'">🏠 Home</button>
<button class="navBtn" onclick="location.href='world.html'">🌍 World</button>
<button class="navBtn" onclick="localStorage.removeItem('zeenat_ceo');location.reload()">🔓 Logout</button>
</div>
</div>

<div id="loginBox" style="max-width:400px;margin:60px auto;text-align:center;padding:20px">
<h2 style="color:#ff0055">CEO Login</h2>
<input type="password" id="ceoPass" placeholder="Enter CEO Password" style="text-align:center">
<button onclick="login()" style="width:100%;background:linear-gradient(90deg,#ff0055,#ff8a00);color:#fff;padding:14px;border:none;border-radius:12px;font-weight:800;margin-top:10px">🔓 Unlock</button>
</div>

<div id="adminBox" style="display:none;max-width:780px;margin:0 auto;padding-bottom:80px">
<div style="display:flex;gap:10px;margin:0 12px">
<button id="bOld" class="tabBtn activeTab" onclick="setTab('old')">📁 OLD 19 Posters - Add Story</button>
<button id="bNew" class="tabBtn inactiveTab" onclick="setTab('new')">📱 NEW Poster - TikTok Gallery</button>
</div>

<!-- OLD 19 -->
<div id="tabOld" class="tabContent show">
<div class="card">
<label>📝 Your 19 Posters - Static (Original)</label>
<select id="oldSelect"></select>

<label>📝 Title</label>
<input id="oldTitle">

<label>👥 Main Characters - Where you put characters name</label>
<textarea id="oldChars" rows="2" placeholder="Example for AMARA: NARRATOR, KING, QUEEN, AMARA, MOTHER, OLD CHIEF..."></textarea>

<label>📄 Short Description (Home page)</label>
<input id="oldShort" placeholder="Short Description">

<label>📖 Long Description (World + SEO) - FULL PAGE</label>
<textarea id="oldLong" rows="3" placeholder="Long Description for World full story page..."></textarea>

<label>🖼️ Choose Image From Phone</label>
<input type="file" id="oldImg" accept="image/*">
<div id="oldPrev" class="previewFull"><img id="oldPImg"></div>

<label>🎬 Full Story - CHARACTER: dialogue - FULL PAGE</label>
<textarea id="oldStory" rows="8" placeholder="KING: hello&#10;QUEEN: hi my king"></textarea>

<label>🌍 Language</label>
<select id="oldLang"><option>🇬🇭 Ghana English</option><option>Twi</option><option>English</option></select>

<!-- MISSING ADDED: POST TO WORLD+HOME FOR OLD -->
<button onclick="updateOld()" class="postBtn" style="background:linear-gradient(90deg,#00c853,#0091ea)">🌍📦 POST TO WORLD + HOME - UPDATE OLD POSTER</button>
</div>
</div>

<!-- NEW -->
<div id="tabNew" class="tabContent">
<div class="card">
<label>📝 NEW Title - Empty</label>
<input id="newTitle" placeholder="Enter NEW story title...">

<label>👥 Main Characters - Where you put characters name</label>
<textarea id="newChars" rows="2" placeholder="Example: NARRATOR, KING, QUEEN, AMARA, MOTHER... Paste all characters name here"></textarea>

<label>📄 Short Description (Home page)</label>
<input id="newShort" placeholder="Short Description for Home...">

<label>📖 Long Description (World + SEO) - FULL PAGE</label>
<textarea id="newLong" rows="3" placeholder="Long Description - Full page for World..."></textarea>

<label>🖼️ Choose Image From Phone - New Poster - FULL IMAGE PAGE</label>
<input type="file" id="newImg" accept="image/*">
<!-- MISSING ADDED: FULL IMAGE PAGE -->
<div id="newPrev" class="previewFull"><img id="newPImg"></div>

<label>🎬 Full Story - CHARACTER: dialogue - FULL PAGE</label>
<textarea id="newStory" rows="10" placeholder="NARRATOR: Long ago...&#10;KING: hello&#10;QUEEN: hi my king"></textarea>

<label>🌍 Language</label>
<select id="newLang"><option>🇬🇭 Ghana English</option><option>Twi</option><option>English</option></select>

<label>🏷️ TikTok Hashtags</label>
<input id="newHash" placeholder="#ghanafolktale #fyp #kumasi">

<button onclick="postNew()" class="postBtn">💾 POST TO WORLD + HOME</button>
</div>
</div>

<div id="msg" style="text-align:center;color:#0f0;margin:12px;font-weight:700"></div>
</div>

<script>
const PASS='Papaja6869$$';
function login(){if(document.getElementById('ceoPass').value===PASS){localStorage.setItem('zeenat_ceo','1');show();}else alert('Wrong!');}
function show(){document.getElementById('loginBox').style.display='none';document.getElementById('adminBox').style.display='block';loadPosters();}
if(localStorage.getItem('zeenat_ceo')==='1')show();
function setTab(t){
 document.getElementById('tabOld').classList.remove('show');document.getElementById('tabNew').classList.remove('show');
 document.getElementById('bOld').className='tabBtn inactiveTab';document.getElementById('bNew').className='tabBtn inactiveTab';
 if(t==='old'){document.getElementById('tabOld').classList.add('show');document.getElementById('bOld').className='tabBtn activeTab';}
 else{document.getElementById('tabNew').classList.add('show');document.getElementById('bNew').className='tabBtn activeTab';}
}
const POSTERS=["AMARA","THE-LIBRARY-SECRET","THE-RIVER-BRIDE","THE-STOLEN-BABY","THE-WHITE-MAN","THE-ABANDONED-HUTS","THE-TWINS","MISSING-BUT-FOUND","SECRETS-OF-THE-LETTER","THE-GENEROUS-HUNTER","THE-FOOD-SELLER","THE-SLAVE-TRADE","THE-HEADMASTER-SECRET","FORGOTTEN-PROMISE","THE-MARKET-GIRL","MY-STEPMOTHERS-DAUGHTER","FOREST-OF-NO-RETURN","SHATTERED-VOW","DEATH-OF-NO-RETURN"];
function loadPosters(){
 const sel=document.getElementById('oldSelect'); sel.innerHTML='';
 POSTERS.forEach((n,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+n.replace(/-/g,' ');sel.appendChild(o);});
 sel.onchange=()=>{document.getElementById('oldTitle').value=POSTERS[sel.value].replace(/-/g,' ');};
 document.getElementById('oldTitle').value=POSTERS[0].replace(/-/g,' ');
}
let oldImgData='',newImgData='';
document.getElementById('oldImg').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{oldImgData=r.result;document.getElementById('oldPImg').src=oldImgData;document.getElementById('oldPrev').style.display='flex';};r.readAsDataURL(f);});
document.getElementById('newImg').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{newImgData=r.result;document.getElementById('newPImg').src=newImgData;document.getElementById('newPrev').style.display='flex';};r.readAsDataURL(f);});
function updateOld(){
 const idx=document.getElementById('oldSelect').value;
 const data={title:document.getElementById('oldTitle').value,characters:document.getElementById('oldChars').value,shortDesc:document.getElementById('oldShort').value,longDesc:document.getElementById('oldLong').value,story:document.getElementById('oldStory').value,img:oldImgData,lang:document.getElementById('oldLang').value,date:Date.now(),poster:POSTERS[idx]};
 let map=JSON.parse(localStorage.getItem('zeenatflix_old_updates')||'{}');map[idx]=data;localStorage.setItem('zeenatflix_old_updates',JSON.stringify(map));
 document.getElementById('msg').innerText='✅ OLD POSTED TO WORLD+HOME: '+data.title;alert('✅ OLD POSTED: '+data.title);
}
function postNew(){
 const data={title:document.getElementById('newTitle').value,characters:document.getElementById('newChars').value,shortDesc:document.getElementById('newShort').value,longDesc:document.getElementById('newLong').value,story:document.getElementById('newStory').value,img:newImgData,lang:document.getElementById('newLang').value,hash:document.getElementById('newHash').value,date:Date.now()};
 if(!data.title){alert('Enter title!');return;}
 let all=JSON.parse(localStorage.getItem('zeenatflix_movies')||'[]');all.unshift({...data,id:Date.now(),type:'new'});localStorage.setItem('zeenatflix_movies',JSON.stringify(all));
 document.getElementById('msg').innerText='✅ NEW POSTED: '+data.title;alert('NEW POSTED TO WORLD+HOME');
 document.getElementById('newTitle').value='';document.getElementById('newChars').value='';document.getElementById('newShort').value='';document.getElementById('newLong').value='';document.getElementById('newStory').value='';document.getElementById('newHash').value='';newImgData='';document.getElementById('newPrev').style.display='none';
}
</script>
</body>
  </html>
