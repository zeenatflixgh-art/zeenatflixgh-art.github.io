<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD PEOPLE - ZEENATFLIX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.top{background:linear-gradient(90deg,#00c853,#0091ea);margin:8px;padding:16px;border-radius:18px;text-align:center}
.top h1{margin:0;font-size:22px;font-weight:900}
.top p{margin:4px 0 0;font-size:13px}
.nav{margin-top:8px;display:flex;gap:8px;justify-content:center}
.nav a{color:#fff;text-decoration:none;background:#000;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700}
.search{margin:12px;background:#1a1a1a;border-radius:30px;padding:12px 16px;display:flex;gap:8px;border:1px solid #222}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#151515;border-radius:12px;overflow:hidden;border:1px solid #222;position:relative}
.card img{width:100%;height:240px;object-fit:cover}
.lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:rgba(0,0,0,0.7);border:2px solid #ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center}
.info{padding:8px}.title{font-weight:800;font-size:12px}.sub{font-size:11px;color:#aaa;height:32px;overflow:hidden}.meta{font-size:11px;color:#888;margin-top:4px;display:flex;gap:6px}
.tiktokZone{margin:16px;background:linear-gradient(135deg,#000,#1a1a1a);border:2px solid #00c853;border-radius:16px;padding:18px;text-align:center}
</style>
</head>
<body>
<div class="top">
<h1>🌍 WORLD PEOPLE</h1>
<p>Global Stories - Tap to Read!</p>
<div class="nav"><a href="index.html">← Back to Home</a><a href="admin.html">👑 CEO Admin</a></div>
</div>
<div class="search">🔍 <input id="searchW" placeholder="Search World..." oninput="doFilterW()"></div>
<div id="gridW" class="grid"></div>

<div class="tiktokZone">
<h2 style="margin:0;color:#00e676">🌍 World TikTok - @nextel96</h2>
<p style="color:#fff;font-weight:800;margin:8px 0">🌹 Zeenat 💚 sonkowa</p>
<p style="color:#aaa;font-size:13px">AI Videos for World People Coming Very Soon!<br>Follow @nextel96</p>
<a href="https://www.tiktok.com/@nextel96" target="_blank" style="display:inline-block;background:linear-gradient(90deg,#00c853,#0091ea);color:#fff;padding:12px 22px;border-radius:25px;text-decoration:none;font-weight:900;margin-top:10px">🌍 Follow @nextel96 World</a>
</div>

<script>
const MOVIES_W=[
{t:"SECRETS OF THE LETTER",img:"https://via.placeholder.com/400x600/ff0055/fff?text=SECRETS",views:"4.2M",likes:"210K",comments:"12K",desc:"World Exclusive - Letter after 20 years"},
{t:"THE ABANDONED HUTS",img:"https://via.placeholder.com/400x600/795548/fff?text=HUTS",views:"1.8M",likes:"87K",comments:"4.3K",desc:"World - Vanishing in forest"},
{t:"THE FOOD SELLER",img:"https://via.placeholder.com/400x600/ff6a00/fff?text=FOOD",views:"2.2M",likes:"95K",comments:"5K",desc:"World - Monica's Secret Gallon"}
];
function renderW(list){const g=document.getElementById('gridW'); g.innerHTML=''; list.forEach(m=>{let d=document.createElement('div'); d.className='card'; d.innerHTML=`<img src="${m.img}"><div class="lock">🔒</div><div class="info"><div class="title">${m.t}</div><div class="sub">${m.desc}</div><div class="meta"><span>👁️ ${m.views}</span><span>❤️ ${m.likes}</span><span>💬 ${m.comments}</span><span>• 🌍 World</span></div></div>`; g.appendChild(d);});}
function doFilterW(){let q=document.getElementById('searchW').value.toLowerCase(); renderW(MOVIES_W.filter(m=>m.t.toLowerCase().includes(q)));}
renderW(MOVIES_W);
</script>
</body>
</html>
