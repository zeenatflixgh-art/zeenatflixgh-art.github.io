<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WORLD PEOPLE</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.header{background:linear-gradient(90deg,#ff8a00,#ff0080);padding:16px 15px;text-align:center;border-radius:16px;margin:8px}
.header h1{margin:0;font-size:26px;font-weight:900;color:#fff;letter-spacing:0.5px}
.header p{margin:4px 0 6px;font-size:13px;color:#fff;opacity:0.95}
.header.links{font-size:12px;color:#fff;opacity:0.9}
.header.links a{color:#fff;text-decoration:none;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#151515;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #222;position:relative}
.card img{width:100%;height:280px;object-fit:cover;display:block}
.lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.65);width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid #ffcc00}
.open{position:absolute;top:8px;right:8px;background:#00ff88;color:#000;padding:3px 8px;border-radius:10px;font-size:9px;font-weight:900}
.info{padding:10px}
.info h3{margin:0;font-size:12px;font-weight:900;line-height:1.2}
.info p{margin:3px 0 0;font-size:11px;color:#aaa;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info.meta{font-size:11px;color:#777;margin-top:4px}
</style>
</head><body>
<div class="header">
<h1>🌍 WORLD PEOPLE</h1>
<p>Global Stories from ZEENATFLIX CEO</p>
<div class="links"><a href="index.html">← Back to Home</a> &nbsp;|&nbsp; <a href="admin.html">👑 CEO Admin</a></div>
</div>
<div class="grid" id="grid"></div>
<script>
const worldPosters=[
{id:"static_2",t:"SECRETS OF THE LETTER",d:"A letter opened after 20 years changed everything!...",i:"SECRETS-OF-THE-LETTER.jpg",v:"4.2M"},
{id:"static_18",t:"SHATTERED VOWS",d:"He broke his vow on wedding night!...",i:"SHATTERED-VOWS.jpg",v:"1.1M"},
{id:"static_4",t:"THE ABANDONED HUTS",d:"The Vanishing of Maame Serwaa",i:"THE-ABANDONED-HUTS.jpg",v:"2.3M"},
{id:"static_7",t:"THE FOOD SELLER",d:"Monica's Secret...",i:"THE-FOOD-SELLER.jpg",v:"3.1M"}
];
function go(id){let s=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");let ws=JSON.parse(localStorage.getItem('world_stories')||"{}");let c=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]").find(m=>m.id==id);if(!s[id]&&!ws[id]&&!c){alert("🔒 Coming Soon! This story is not ready yet. Please try another one!");return;}location.href='story.html?id='+id;}
function render(){let stories=JSON.parse(localStorage.getItem('zeenat_poster_stories')||"{}");let wstories=JSON.parse(localStorage.getItem('world_stories')||"{}");let custom=JSON.parse(localStorage.getItem('zeenatflix_movies')||"[]");let h="";worldPosters.forEach(p=>{let has=stories[p.id]||wstories[p.id]||custom.find(m=>m.id==p.id);let img=localStorage.getItem('zeenat_poster_img_'+p.id)||p.i;let badge=!has?`<div class="lock">🔒</div>`:`<div class="open">🔓 OPEN</div>`;h+=`<div class="card" onclick="go('${p.id}')"><img src="${img}" onerror="this.src='https://via.placeholder.com/300x400/ff8a00/fff?text=${encodeURIComponent(p.t)}'">${badge}<div class="info"><h3>${p.t}</h3><p>${p.d}</p><div class="meta">👁️ ${p.v} • 🌍 World Exclusive</div></div></div>`});document.getElementById('grid').innerHTML=h;}
render();
  // === ZEENATFLIX OLD + NEW CONNECTED - PASTE HERE ===
let movies=JSON.parse(localStorage.getItem('zeenatflix_movies')||'[]');
let map={}; movies.forEach(m=>{ if(m.staticFile) map[m.staticFile]=m; });
document.querySelectorAll('img').forEach(img=>{
  let file=(img.getAttribute('src')||'').split('/').pop();
  if(map[file]){
    let m=map[file];
    img.style.border="3px solid #ff0050"; img.style.cursor="pointer"; img.style.borderRadius="12px";
    img.parentElement.onclick=()=>{ localStorage.setItem('zeenatflix_play',JSON.stringify(m)); alert('▶️ PLAYING: '+m.title+'\n\n'+m.shortDesc); };
  }
});
// Show new TikTok gallery posters #20,21...
let cont=document.createElement('div'); cont.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 10px";
document.body.insertBefore(cont, document.querySelector('script'));
movies.filter(x=>x.gallery).reverse().forEach(m=>{
  let d=document.createElement('div'); d.style.cssText="background:#151515;border-radius:12px;overflow:hidden;border:1px solid #222;cursor:pointer";
  d.innerHTML=`<img src="${m.gallery}" style="width:100%;height:220px;object-fit:cover"><div style="padding:10px"><b style="font-size:12px">${m.title}</b><div style="font-size:11px;color:#777">${m.shortDesc||''}</div><div style="margin-top:6px;background:#ff0050;color:#fff;display:inline-block;padding:4px 10px;border-radius:12px;font-size:10px">▶️ NEW</div></div>`;
  d.onclick=()=>{ localStorage.setItem('zeenatflix_play',JSON.stringify(m)); alert('▶️ PLAYING NEW: '+m.title); };
  cont.appendChild(d);
});
</script></body></html>
</script></body></html>
