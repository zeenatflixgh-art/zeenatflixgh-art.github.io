<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD PEOPLE - ZEENATFLIX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.top{background:linear-gradient(90deg,#00c853,#0091ea);margin:8px;padding:16px;border-radius:18px;text-align:center}
.top h1{margin:0;font-size:22px;font-weight:900}.top p{margin:4px 0 0;font-size:13px}
.nav{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.nav a{color:#fff;text-decoration:none;background:#000;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700}
.adminHidden{display:none}
.search{margin:12px;background:#1a1a1a;border-radius:30px;padding:12px 16px;display:flex;gap:8px;border:1px solid #222}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#151515;border-radius:12px;overflow:hidden;border:1px solid #222;position:relative;cursor:pointer}
.card img{width:100%;height:240px;object-fit:cover;display:block}
.lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:rgba(0,0,0,0.7);border:2px solid #ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.info{padding:8px}.title{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11px;color:#aaa;margin-top:2px;height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:11px;color:#888;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.tiktokZone{margin:16px;background:linear-gradient(135deg,#000,#1a1a1a);border:2px solid #00c853;border-radius:16px;padding:18px;text-align:center}
</style>
</head>
<body>
<div class="top">
<h1>🌍 WORLD PEOPLE</h1>
<p>Global Stories - Tap to Read! 🌍</p>
<div class="nav"><a href="index.html">← Back Home</a><a href="admin.html" class="adminHidden">👑 CEO Admin</a></div>
</div>
<div class="search">🔍 <input id="sW" placeholder="Search World..." oninput="filterW()"></div>
<div id="gridW" class="grid"></div>

<!-- TIKTOK ZONE WORLD WITH FOLLOWERS -->
<div class="tiktokZone">
<h2 style="margin:0;color:#00e676">🌍 World TikTok - @nextel96</h2>
<p style="color:#fff;font-weight:800;margin:8px 0">🌹 Zeenat 💚 sonkowa</p>
<p style="color:#aaa;font-size:13px">Full stories here 👇<br>https://zeenatflixgh-art.github.io<br>AI Videos for World People Coming Very Soon!</p>

<div style="margin:12px 0;display:flex;justify-content:space-around;background:#0f0f0f;border-radius:10px;padding:10px">
<div><b style="color:#fff;font-size:16px">0</b><br><span style="color:#888;font-size:11px">Following</span></div>
<div><b id="fCountW" style="color:#fff;font-size:16px">2</b><br><span style="color:#888;font-size:11px">Followers</span></div>
<div><b style="color:#fff;font-size:16px">78</b><br><span style="color:#888;font-size:11px">Likes</span></div>
</div>

<button id="followBtnW" onclick="doFollowWorld()" style="display:inline-block;background:linear-gradient(90deg,#00c853,#0091ea);color:#fff;padding:12px 22px;border-radius:25px;border:none;font-weight:900;margin-top:10px;cursor:pointer">🌍 Follow @nextel96 World</button>
<a href="https://www.tiktok.com/@nextel96" target="_blank" style="display:block;color:#aaa;font-size:11px;margin-top:8px;text-decoration:none">Open TikTok →</a>
</div>

<script>
const MOVIES=[
{t:"SECRETS OF THE LETTER",img:"SECRETS-OF-THE-LETTER.jpg",views:"4.2M",likes:"210K",comments:"12K",desc:"World Exclusive - Letter after 20 years"},
{t:"THE ABANDONED HUTS",img:"THE-ABANDONED-HUTS.jpg",views:"1.8M",likes:"87K",comments:"4.3K",desc:"The Vanishing of Maame Serwaa"},
{t:"THE FOOD SELLER",img:"THE-FOOD-SELLER.jpg",views:"2.2M",likes:"95K",comments:"5K",desc:"Monica's Secret Gallon"},
{t:"AMARA",img:"AMARA.jpg",views:"3.5M",likes:"150K",comments:"9K",desc:"A girl who wanted Accra"},
{t:"THE LIBRARY SECRET",img:"THE-LIBRARY-SECRET.jpg",views:"1.9M",likes:"80K",comments:"3.2K",desc:"Secret in Kumasi Library"},
{t:"THE RIVER BRIDE",img:"THE-RIVER-BRIDE.jpg",views:"2.1M",likes:"92K",comments:"4K",desc:"Bride of River Tano"},
{t:"THE WHITE MAN",img:"THE-WHITE-MAN.jpg",views:"1.5M",likes:"70K",comments:"2.8K",desc:"Obroni in Ashanti village"},
{t:"THE TWINS",img:"THE-TWINS.jpg",views:"2.8M",likes:"130K",comments:"6.5K",desc:"Twins with one destiny"},
{t:"MY STEPMOTHERS DAUGHTER",img:"MY-STEPMOTHERS-DAUGHTER.jpg",views:"3.0M",likes:"140K",comments:"8K",desc:"Wicked stepmother story"}
];
function renderW(list){const g=document.getElementById('gridW'); g.innerHTML=''; list.forEach(m=>{let d=document.createElement('div'); d.className='card'; d.innerHTML=`<img src="${m.img}" onerror="this.src='https://via.placeholder.com/400x600?text=${encodeURIComponent(m.t)}'"><div class="lock">🔒</div><div class="info"><div class="title">${m.t}</div><div class="sub">${m.desc}</div><div class="meta"><span>👁️ ${m.views}</span><span>❤️ ${m.likes}</span><span>💬 ${m.comments}</span><span>• 🌍 World</span></div></div>`; d.onclick=()=>{localStorage.setItem('zeenat_play',JSON.stringify(m)); location.href='story.html';}; g.appendChild(d);});}
function filterW(){let q=document.getElementById('sW').value.toLowerCase(); renderW(MOVIES.filter(m=>m.t.toLowerCase().includes(q)));}
renderW(MOVIES);

// FOLLOWERS FOR WORLD
let fKeyW='zeenat_followers_world'; let followedKeyW='zeenat_followed_world';
function initFollowW(){let c=parseInt(localStorage.getItem(fKeyW)||localStorage.getItem('zeenat_followers')||'2'); document.getElementById('fCountW').innerText=c; document.getElementById('fCountW').innerText=c; document.getElementById('fCountW').textContent=c; if(localStorage.getItem(followedKeyW)||localStorage.getItem('zeenat_followed')){document.getElementById('followBtnW').innerText='✅ Following'; document.getElementById('followBtnW').innerText='✅ Following'; document.getElementById('followBtnW').textContent='✅ Following'; document.getElementById('followBtnW').style.background='#00c853';}}
function doFollowWorld(){
let btn=document.getElementById('followBtnW'); let countEl=document.getElementById('fCountW');
if(localStorage.getItem(followedKeyW)){
localStorage.removeItem(followedKeyW); localStorage.removeItem('zeenat_followed');
let c=parseInt(localStorage.getItem(fKeyW)||'2')-1; if(c<0)c=0; localStorage.setItem(fKeyW,c); localStorage.setItem('zeenat_followers',c);
countEl.innerText=c; btn.innerText='🌍 Follow @nextel96 World'; btn.style.background='linear-gradient(90deg,#00c853,#0091ea)';
}else{
let c=parseInt(localStorage.getItem(fKeyW)||localStorage.getItem('zeenat_followers')||'2')+1; localStorage.setItem(fKeyW,c); localStorage.setItem('zeenat_followers',c); localStorage.setItem(followedKeyW,'1'); localStorage.setItem('zeenat_followed','1');
countEl.innerText=c; btn.innerText='✅ Following'; btn.style.background='#00c853'; window.open('https://www.tiktok.com/@nextel96','_blank');
}}
initFollowW();
</script>
</body>
</html>
