<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD PEOPLE - ZEENATFLIX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}
.top{background:linear-gradient(90deg,#00c853,#0091ea);margin:8px;padding:16px;border-radius:18px;text-align:center}
.top h1{margin:0;font-size:22px;font-weight:900}.nav{margin-top:8px;display:flex;gap:8px;justify-content:center}
.nav a{color:#fff;text-decoration:none;background:#000;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700}
.search{margin:12px;background:#1a1a1a;border-radius:30px;padding:12px 16px;display:flex;gap:8px;border:1px solid #222}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#151515;border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
.card img{width:100%;height:240px;object-fit:cover}
.lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;background:rgba(0,0,0,0.85);border:2px solid #ffcc00;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
.newBadge{position:absolute;top:8px;right:8px;background:#00c853;color:#fff;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:900}
.info{padding:8px}.title{font-weight:800;font-size:12px}.sub{font-size:11px;color:#aaa;height:32px;overflow:hidden}.meta{font-size:11px;color:#888;margin-top:4px;display:flex;gap:6px}
.tiktokZone{margin:16px;background:linear-gradient(135deg,#000,#1a1a1a);border:2px solid #00c853;border-radius:16px;padding:18px;text-align:center}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,#00c853,#0091ea);color:#fff;padding:14px 22px;border-radius:25px;font-weight:900;font-size:13px;z-index:9999;display:none;max-width:92%;text-align:center}
</style>
</head>
<body>
<div class="top"><h1>🌍 WORLD PEOPLE</h1><p>Global Stories - Tap to Read! 🌍</p><div class="nav"><a href="index.html">← Back Home</a></div></div>
<div class="search">🔍 <input id="sW" placeholder="Search World..." oninput="filterW()"></div>
<div id="gridW" class="grid"></div>
<div id="toastW" class="toast"></div>
<script>
const MOVIES=[
 {t:"THE RIVER BRIDE PART 2 - THE LAST NIGHT",desc:"Continuation of River Bride",img:"RIVER_BRIDE_PART_2_-_THE_LAST_NIGHT.jpg",views:"3.2M",likes:"145K",comments:"8.5K",free:true,tag:"World"},
{t:"THE RIVER BRIDE PART 3 - THE FINAL END",desc:"Final end of River Bride",img:"RIVER_BRIDE_PART_3_-_THE_FINAL_END.jpg",views:"3.3M",likes:"150K",comments:"9.2K",free:true,tag:"World"},
{t:"THE STOLEN BABY",img:"THE-STOLEN-BABY.jpg",views:"3.1M",likes:"125K",comments:"8.2K",desc:"A Mother's Worst Nightmare"},
{t:"MISSING BUT FOUND",img:"MISSING-BUT-FOUND.jpg",views:"2.0M",likes:"98K",comments:"5.4K",desc:"Lost 7 Years, Found Selling Pure Water"},
{t:"SECRETS OF THE LETTER",img:"SECRETS-OF-THE-LETTER.jpg",views:"4.2M",likes:"210K",comments:"12K",desc:"A letter opened after 20 years..."},
{t:"THE SLAVE TRADE",img:"THE-SLAVE-TRADE.jpg",views:"2.5M",likes:"110K",comments:"6K",desc:"The Pot That Refused To Cross The Sea"},
{t:"THE FOOD SELLER",img:"THE-FOOD-SELLER.jpg",views:"2.2M",likes:"95K",comments:"5K",desc:"Monica's Secret"},
{t:"AMARA",img:"AMARA.jpg",views:"3.5M",likes:"150K",comments:"9K",desc:"A girl who wanted Accra"},
{t:"THE MARKET GIRL",img:"THE-MARKET-GIRL.jpg",views:"2.4M",likes:"100K",comments:"5.2K",desc:"Kejetia market girl rise"},
{t:"MY STEPMOTHERS DAUGHTER",img:"MY-STEPMOTHERS-DAUGHTER.jpg",views:"3.0M",likes:"140K",comments:"8K",desc:"Wicked stepmother story"},
{t:"FOREST OF NO RETURN",img:"FOREST-OF-NO-RETURN.jpg",views:"1.9M",likes:"82K",comments:"3.8K",desc:"Forest where people vanish"},
{t:"DEATH OF NO RETURN",img:"DEATH-OF-NO-RETURN.jpg",views:"2.2M",likes:"90K",comments:"4.5K",desc:"Death that came twice"},
{t:"THE ABANDONED HUTS",img:"THE-ABANDONED-HUTS.jpg",views:"3.8M",likes:"180K",comments:"10K",desc:"The abandoned huts - Hidden village secret"},
{t:"THE LIBRARY SECRET",img:"THE-LIBRARY-SECRET.jpg",views:"2.8M",likes:"130K",comments:"7K",desc:"Secret hidden in the library"},
{t:"THE RIVER BRIDE",img:"THE-RIVER-BRIDE.jpg",views:"3.2M",likes:"145K",comments:"8.5K",desc:"The bride of the river god"},
{t:"THE WHITE MAN",img:"THE-WHITE-MAN.jpg",views:"2.6M",likes:"115K",comments:"6.2K",desc:"The white man in the village"},
{t:"THE TWINS",img:"THE-TWINS.jpg",views:"2.9M",likes:"135K",comments:"7.5K",desc:"Twins with same destiny"},
{t:"THE GENEROUS HUNTER",img:"THE-GENEROUS-HUNTER.jpg",views:"2.3M",likes:"105K",comments:"5.8K",desc:"Hunter who gave all away"},
{t:"THE HEADMASTER SECRET",img:"THE-HEADMASTER-SECRET.jpg",views:"3.0M",likes:"125K",comments:"7K",desc:"Headmaster's dark secret"},
{t:"FORGOTTEN PROMISE",img:"FORGOTTEN-PROMISE.jpg",views:"2.7M",likes:"120K",comments:"6.5K",desc:"Promise made 20 years ago"},
{t:"SHATTERED VOWS",img:"SHATTERED-VOWS.jpg",views:"2.5M",likes:"110K",comments:"6K",desc:"Vow broken by love"},
{t:"ANANSE AND THE VILLAGE THAT NEVER SLEPT",img:"ANANSE.jpg",views:"4.5M",likes:"250K",comments:"15K",desc:"Ananse and the village that never slept - FREE"}
];
function showToastW(m){let t=document.getElementById('toastW'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3000);}
function hasFullStory(title){let db=JSON.parse(localStorage.getItem('zeenat_stories_db')||'{}'); return db[title] && db[title].full && db[title].full.length>50;}
function getDB(){return JSON.parse(localStorage.getItem('zeenat_stories_db')||'{}');}
function renderW(list){
 const g=document.getElementById('gridW'); g.innerHTML=''; let db=getDB();
 list.forEach(m=>{
  let posted=db[m.t];
  let isPosted=hasFullStory(m.t) || m.free===true;
  let lockHTML=isPosted?`<div class="newBadge">🔓 FREE</div>`:`<div class="lock">🔒</div>`;
  let border=isPosted?'2px solid #00c853':'1px solid #222';
  let shortText=posted?.short||m.desc||m.d||"";
  let d=document.createElement('div'); d.className='card'; d.style.border=border;
  d.innerHTML=`<img src="${m.img}" onerror="this.src='https://via.placeholder.com/400x600/111/fff?text=${encodeURIComponent(m.t)}'">${lockHTML}<div class="info"><div class="title">${m.t}</div><div class="sub">${shortText}</div><div class="meta"><span>👁️ ${m.views}</span><span>❤️ ${m.likes}</span><span>💬 ${m.comments}</span><span>• 🌍 World</span></div></div>`;
  d.onclick=()=>{
   if(!isPosted){showToastW('🚀 No story yet - Will post them soon! Follow @nextel96 💚'); return;}
   if(!posted){showToastW('📖 Opening free preview...'); localStorage.setItem('zeenat_play',JSON.stringify(m)); location.href='story.html'; return;}
   localStorage.setItem('zeenat_play',JSON.stringify({...m,...posted})); location.href='story.html';
  };
  g.appendChild(d);
 });
}
function filterW(){let q=document.getElementById('sW').value.toLowerCase(); renderW(MOVIES.filter(m=>m.t.toLowerCase().includes(q)));}
renderW(MOVIES);
</script>
</body>
</html>
