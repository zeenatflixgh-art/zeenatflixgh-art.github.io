<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World - ZEENATFLIX</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}
.topBar{background:linear-gradient(90deg,#ff0055,#ff8a00);padding:12px;border-radius:20px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.backBtn{background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-weight:900;text-decoration:none;font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:#1a1a1a;border:1px solid #222;border-radius:12px;display:flex;gap:10px;padding:10px}
.card img{width:90px;height:120px;object-fit:cover;border-radius:8px;background:#000}
.card .info{flex:1}
.card .info b{font-size:14px;display:block;margin-bottom:4px}
.card .info p{font-size:12px;color:#aaa;margin:0;line-height:1.4}
.search{width:100%;background:#1a1a1a;border:1px solid #222;color:#fff;padding:12px;border-radius:12px;margin-bottom:12px;outline:none}
</style>
</head>
<body>
<div class="topBar"><a class="backBtn" href="index.html">← Home</a><b>🌍 WORLD - All Stories</b></div>
<input id="search" class="search" placeholder="🔍 Search world..." oninput="doSearch()">
<div id="grid" class="grid"></div>
<script>
const FALLBACK=[
{t:"THE RIVER BRIDE PART 2 - THE LAST NIGHT",img:"THE-RIVER-BRIDE-PART-2-THE-LAST-NIGHT.jpg",short:"River bride returns",long:"Full synopsis of River Bride Part 2"},
{t:"MY HUSBAND IS A SNAKE",img:"MY-HUSBAND-IS-A-SNAKE.jpg",short:"Poor waitress marries billionaire who is snake at midnight",long:"Full story of Sandra and python husband"},
{t:"THE KAYAYO GIRL PART 1",img:"THE-KAYAYO-GIRL-PART-1.jpg",short:"Kayayo girl story",long:"Kayayo struggles in Accra"}
];
let ALL=[];
async function load(){
  try{
    let r=await fetch('stories.json?v='+Date.now());
    if(r.ok){
      let j=await r.json();
      let fromJson=Object.values(j);
      let seen=new Set();
      ALL=[];
      [...fromJson, ...FALLBACK].forEach(m=>{
        let k=(m.t||m.title||'').toUpperCase();
        if(k && !seen.has(k)){seen.add(k); ALL.push(m);}
      });
    }else{ALL=FALLBACK;}
  }catch(e){ALL=FALLBACK;}
  render(ALL);
}
function render(list){
  document.getElementById('grid').innerHTML=list.map(m=>`
    <div class="card" onclick='openStory(${JSON.stringify(m.t||m.title).replace(/'/g,"&#39;")})'>
      <img src="${m.img||m.image}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
      <div class="info"><b>${m.t||m.title}</b><p>${m.short||m.desc||''}</p><p style="color:#ff8a00;margin-top:6px">${(m.long||'').substring(0,120)}...</p></div>
    </div>
  `).join('');
}
function openStory(title){
  let found=ALL.find(x=>(x.t||x.title)===title)||{t:title};
  localStorage.setItem('zeenat_play',JSON.stringify(found));
  location.href='story.html';
}
function doSearch(){
  let q=document.getElementById('search').value.toUpperCase();
  render(ALL.filter(m=>(m.t||m.title||'').toUpperCase().includes(q)));
}
load();
</script>
</body>
</html>
