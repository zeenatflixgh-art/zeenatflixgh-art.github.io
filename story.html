<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story - ZEENATFLIX</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}
.topBar{background:linear-gradient(90deg,#ff0055,#ff8a00);padding:12px;border-radius:20px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.backBtn{background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-weight:900;text-decoration:none;font-size:13px}
.poster{width:100%;max-height:420px;object-fit:contain;background:#000;border-radius:12px}
.title{font-size:20px;font-weight:900;margin:12px 0 6px}
.metaRow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.metaChip{background:#1a1a1a;border:1px solid #222;padding:6px 12px;border-radius:20px;font-size:12px}
.box{background:#1a1a1a;border:1px solid #222;border-radius:12px;padding:12px;margin:10px 0;font-size:13px;line-height:1.6}
.readBtn{display:flex;gap:8px;margin:12px 0}
.readBtn button{flex:1;padding:14px;border:none;border-radius:25px;font-weight:900;font-size:14px;cursor:pointer}
.btnRead{background:linear-gradient(90deg,#ff0055,#ff8a00);color:#fff}
.btnLike{background:#222;color:#fff;border:1px solid #333!important}
.storyLine{margin:8px 0;padding:10px;background:#111;border-radius:8px;border-left:3px solid #ff0055}
.charName{font-weight:900;color:#ff8a00;font-size:12px;margin-bottom:2px}
.actionRow{display:flex;gap:8px;margin:12px 0}
.actionRow button{flex:1;padding:12px;border-radius:25px;border:none;font-weight:800;cursor:pointer}
.share{background:#00e676;color:#000}.copy{background:#fff;color:#000}
.followRow{display:flex;gap:8px;margin:10px 0}
.followBtn{flex:1;padding:14px;border-radius:25px;border:none;font-weight:900;cursor:pointer;background:linear-gradient(90deg,#ff0055,#ff8a00);color:#fff}
.followBtn.following{background:#00c853!important}
.commentBox{background:#151515;border-radius:12px;padding:12px;margin-top:14px}
.commentBox input{width:100%;background:#0a0a0a;border:1px solid #222;color:#fff;padding:12px;border-radius:10px;outline:none}
.cItem{background:#0a0a0a;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:13px}
.tiktokBtn{display:block;background:linear-gradient(90deg,#ff0055,#ff8a00);color:#fff;text-align:center;padding:14px;border-radius:25px;text-decoration:none;font-weight:900;margin:14px 0}
</style>
</head>
<body>
<div class="topBar"><a class="backBtn" href="index.html">← Back</a><b>ZEENATFLIX</b></div>
<img id="poster" class="poster" src="">
<h1 id="title" class="title"></h1>
<div class="metaRow">
<span class="metaChip" id="views">👁️ 0 views</span>
<span class="metaChip" id="likes">❤️ 0 likes</span>
<span class="metaChip" id="followers">👥 0 followers</span>
<span class="metaChip" id="comCount">💬 0 comments</span>
<span class="metaChip">⭐ 4.9</span>
</div>

<div class="readBtn">
<button class="btnRead" onclick="scrollToStory()">▶️ Tap to Read Full Story</button>
<button class="btnLike" id="likeBtn" onclick="doLike()">❤️ Like</button>
</div>

<div class="followRow">
<button class="followBtn" id="followBtn" onclick="doFollow()">+ Follow Zeenat 💚</button>
</div>

<div class="box"><b>📖 Short:</b><div id="short"></div></div>
<div class="box"><b>📖 Long:</b><div id="long"></div></div>

<h3 id="storyAnchor">🎬 Full Story</h3>
<div id="story"></div>

<div class="actionRow">
<button class="share" onclick="shareLink()">🔗 Share Link</button>
<button class="copy" onclick="copyLink()">📋 Copy Link</button>
</div>

<a class="tiktokBtn" href="https://www.tiktok.com/@nextel96" target="_blank">🔥 Watch AI Video on TikTok @nextel96<br><small style="font-size:11px">https://zeenatflixgh-art.github.io</small></a>

<div class="commentBox">
<h3 style="margin:0 0 8px">💬 Comments</h3>
<input id="commentInput" placeholder="Write a comment..." onkeydown="if(event.key==='Enter')addComment()">
<div id="commentList"></div>
<button style="margin-top:8px;width:100%;padding:10px;border-radius:10px;border:none;background:#ff0055;color:#fff;font-weight:800" onclick="addComment()">Post Comment</button>
</div>

<script>
let m=JSON.parse(localStorage.getItem('zeenat_play')||'{}');
let id=(m.t||m.title||'story').replace(/\s/g,'_');
let viewsKey='views_'+id, likesKey='likes_'+id, likedKey='liked_'+id, commentsKey='comments_'+id, followersKey='followers_'+id, followedKey='followed_'+id;
function getNum(k,d=0){return parseInt(localStorage.getItem(k)||d);}
function scrollToStory(){document.getElementById('storyAnchor').scrollIntoView({behavior:'smooth'});}
function init(){
document.getElementById('poster').src=m.img||''; document.getElementById('title').innerText=m.t||m.title||'';
document.getElementById('short').innerText=m.desc||m.shortDesc||'Full Ghana tale...';
document.getElementById('long').innerText=m.l||m.longDesc||m.desc||'Enjoy this full story...';
let v=getNum(viewsKey,1)+1; localStorage.setItem(viewsKey,v); document.getElementById('views').innerText='👁️ '+v+' views';
let l=getNum(likesKey,0); document.getElementById('likes').innerText='❤️ '+l+' likes';
let f=getNum(followersKey,0); document.getElementById('followers').innerText='👥 '+f+' followers';
if(localStorage.getItem(likedKey))document.getElementById('likeBtn').innerText='💖 Liked';
if(localStorage.getItem(followedKey)){document.getElementById('followBtn').innerText='✅ Following Zeenat 💚'; document.getElementById('followBtn').classList.add('following');}
let s=m.story||`Narrator: ${m.desc||'Once upon a time...'} \n${m.t}: Beginning of story...\nAma: We continue...`;
let html=s.split('\n').filter(x=>x.trim()).map(line=>{let p=line.split(':'); if(p.length>=2){return `<div class="storyLine"><div class="charName">${p[0].trim()}:</div><div>${p.slice(1).join(':').trim()}</div></div>`} else {return `<div class="storyLine"><div>${line}</div></div>`}}).join('');
document.getElementById('story').innerHTML=html; renderComments();
}
function doLike(){if(localStorage.getItem(likedKey))return; let l=getNum(likesKey,0)+1; localStorage.setItem(likesKey,l); localStorage.setItem(likedKey,'1'); document.getElementById('likes').innerText='❤️ '+l+' likes'; document.getElementById('likeBtn').innerText='💖 Liked';}
function doFollow(){let btn=document.getElementById('followBtn'); if(localStorage.getItem(followedKey)){let f=getNum(followersKey,1)-1; if(f<0)f=0; localStorage.setItem(followersKey,f); localStorage.removeItem(followedKey); document.getElementById('followers').innerText='👥 '+f+' followers'; btn.innerText='+ Follow Zeenat 💚'; btn.classList.remove('following');} else {let f=getNum(followersKey,0)+1; localStorage.setItem(followersKey,f); localStorage.setItem(followedKey,'1'); document.getElementById('followers').innerText='👥 '+f+' followers'; btn.innerText='✅ Following Zeenat 💚'; btn.classList.add('following');}}
function shareLink(){if(navigator.share){navigator.share({title:m.t, url:'https://zeenatflixgh-art.github.io'});} else {copyLink();}}
function copyLink(){navigator.clipboard.writeText('https://zeenatflixgh-art.github.io'); alert('Link Copied! https://zeenatflixgh-art.github.io');}
function addComment(){let inp=document.getElementById('commentInput'); if(!inp.value.trim())return; let arr=JSON.parse(localStorage.getItem(commentsKey)||'[]'); arr.push({text:inp.value, time:new Date().toLocaleString()}); localStorage.setItem(commentsKey,JSON.stringify(arr)); inp.value=''; renderComments();}
function renderComments(){let arr=JSON.parse(localStorage.getItem(commentsKey)||'[]'); document.getElementById('comCount').innerText='💬 '+arr.length+' comments'; document.getElementById('commentList').innerHTML=arr.map(c=>`<div class="cItem">👤 ${c.text}<br><small style="color:#888">${c.time}</small></div>`).join('')||'<p style="color:#666;font-size:12px">No comments yet. Be first!</p>';}
init();
</script>
</body>
</html>
